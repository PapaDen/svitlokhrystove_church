 тому, як вони можуть ходити в Дусі і жити життям, наповненим силою, творячись на основі Слова і молячись на мовах відповідно до того, як Святий Дух дає їм.\nКнига рос. мовою.", "price": 380, "in_stock": false, "date": "2026-06-19", "photos": ["photos/photo_116@19-06-2026_09-21-53.jpg"], "cat": "other"}, {"id": 130, "title": "Дітріх Бонгьоффер - Псалми", "desc": "Книга видатного німецького богослова та мученика ХХ століття Дітріха Бонгьоффера «Псалми. Молитовна книга Біблії» відкриває читачам глибину і значущість Псалтиря як книги молитви для християн усіх поколінь. Автор пропонує богословське осмислення Псалмів, пояснюючи їхню роль у житті вірян та християнської спільноти.\nЦей твір стане цінним джерелом для всіх, хто прагне глибше зрозуміти біблійні молитви та зробити їх частиною власного спілкування з Богом.\nДітріх Бонгьоффер – видатний німецький богослов, пастор, автор впливових богословських праць, учасник антинацистської змови, який був страчений в німецькому концтаборі. “Псалми: молитовна книга Біблії” – остання книжка, яка вийшла за життя автора.", "price": 200, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_115@19-06-2026_09-20-55.jpg"], "cat": "other"}, {"id": 129, "title": "Гері Міллер - Сімейні фінанси", "desc": "Книга «Сімейні фінанси в світлі Божого Царства» написана простою мовою\nі читається із задоволенням.\nЦе вчення про Царство Боже для людей, які зосереджені на ньому.\nАвтор Гері Міллер розбирає на частини наше уявлення про фінанси і ретельно складає його заново так, щоб все набуло сенсу. Завдяки здоровому глузду в підході до особистих фінансів та увазі до прославляння Бога ця книга є реалістичною, гумористичною і серйозно налаштованою на те, щоб допомогти нам стати розпорядниками, а не власниками.", "price": 350, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_114@19-06-2026_09-20-22.jpg"], "cat": "other"}, {"id": 128, "title": "Адмірал Вільям Г. Макрейвен - Застеляйте ліжко", "desc": "У цьому невеличкому виданні адмірал Вільям Г. Макрейвен, командувач Військово-морських сил США у відставці, визначив десять правил, яких він особисто завжди намагався дотримуватися і які допомогли йому з честю подолати чимало життєвих негараздів. Оригінально сформульовані правила на кшталт \"не боятися акул\", \"не вдаряти передчасно у дзвін\", \"щоранку застеляти ліжко\" мають глибокий підтекст.\nАвтор розкриває суть кожного правила, розповідає цікаві історії про людей, які свого часу надихали його власною дисципліною, наполегливістю, благородством і мужністю.", "price": 450, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_113@19-06-2026_09-19-56.jpg"], "cat": "other"}, {"id": 127, "title": "Джон Максвелл - 17 незаперечнихх законів командної роботи", "desc": "Окремі зірки можуть допомогти піднятися вашій команді, але лише до певного рівня. Однак, справжній успіх — чи то в бізнесі, родині, церкві, спортивних командах чи будь-якій іншій організації — повністю залежить від командної роботи. Але як створити таку команду?\nУ цій книжці доктор Максвелл серед іншого показує, як:\n— Закон високого морального духу надихнув 50-річного чоловіка, який навіть не вмів плавати, пройти виснажливі тренування для участі в найскладнішому триатлоні в світі;\n— Закон загальної картини спонукав колишнього президента США подорожувати країною автобусом, спати в підвалі та виконувати фізичну роботу;\n— Дотримання Закону табло дозволило одній веб-компанії продовжувати зростати і заробляти гроші, тоді як тисячі інших інтернет-бізнесів зазнали краху;\n— Ігнорування Закону цінника призвело до закриття одного з найбільших ритейлерів світу", "price": 500, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_112@19-06-2026_09-19-08.jpg"], "cat": "other"}, {"id": 126, "title": "\"Тільки чесно\"", "desc": "Гра для глибоких розмов та роздумів, яка допомагає пізнати себе та інших.\n«тільки чесно» має дві категорії карток:\n- «чесно з тобою» - для спілкування з іншими;\n- «Чесно з собою» - для особистих роздумів або відвертих бесід з близькими.\nКожна картка поєднує вірш із Писання та питання, що спонукають до роздумів і чесниз відповідей.\nГотові до відвертих розмов? Тільки чесно…", "price": 900, "in_stock": true, "date": "2026-06-18", "photos": ["photos/photo_111@18-06-2026_19-28-47.jpg"], "cat": "other"}, {"id": 125, "title": "\"Без зайвих слів\"", "desc": "Поясни якнайбільше, використавши якнайменше слів. Впораєшся?\n\"Без зайвих слів\" — командна гра, де потрібно говорити швидко й лаконічно.\nТвоє завдання — пояснити слово без зайвих деталей чи жестів. Завдання команди — відгадати якнайшвидше, бажано з одного слова.\nПереможе команда з найменшим коефіцієнтом: кількість слів ÷ кількість відгаданих.\nПрості правила та динамічна гра подарують море емоцій для підліткових та молодіжних зустрічей, вечорів з друзями та родиною.", "price": 900, "in_stock": true, "date": "2026-06-18", "photos": ["photos/photo_110@18-06-2026_19-28-27.jpg"], "cat": "other"}, {"id": 124, "title": "\"Віротренажер\"", "desc": "Це не просто гра, а унікальний інструмент для розвитку християнських навичок у реальному житті.\nУ ній ви опинитеся в різних ситуаціях і зіткнетеся з питаннями про віру, які часто виникають у розмовах про Христа. Кожен раунд відкриває нові можливості для дискусій і роздумів, допомагаючи краще зрозуміти, як Писання впливає на щоденне життя.\nГра навчає бути впевненим і відкритим у спілкуванні про віру, приймаючи різні ролі та випробовуючи себе в нестандартних ситуаціях. Грати можна як у компанії від трьох осіб, так і вдвох.\nЯк відповісти скептику, який називає релігію «милицею для слабких»? Як пояснити, що Біблія — це не вигадка?\nГра-симулятор євангелізації допоможе вам підготуватися до таких викликів! У ній ви зіткнетеся з понад 30 000 унікальних сценаріїв і навчитеся відповідати на запитання невіруючих у безпечному середовищі. Отримайте досвід, який зробить вас сміливішими у проголошенні Євангелії!", "price": 1000, "in_stock": true, "date": "2026-06-18", "photos": ["photos/photo_109@18-06-2026_19-28-19.jpg"], "cat": "other"}, {"id": 123, "title": "\"(Не)прості дилеми\"", "desc": "Християнська гра, що випробує твоє мислення, принципи та чесність.\nУ ній 150 ситуацій: кумедних, легких і по-справжньому складних.\nУяви: перед тобою два варіанти. Обидва непрості. Обидва мають свої плюси й мінуси.\nЩо ти обереш?\nОбирай категорію під свою компанію:\n• ФАН — веселі дилеми для гарного настрою;\n• ЛАЙТ — легкі дилеми для знайомства;\n• ХАРД — моральні та духовні дилеми для серйозних роздумів.\nГра допоможе краще зрозуміти себе, аргументувати позицію та поважати вибір інших.\nДля 3–10 гравців, підійде для:\n• дітей, підлітків і молоді;\n• друзів та родини;\n• домашніх і лідерських груп.\nРоби свій вибір, переконуй інших і збирай фішки, щоб стати переможцем!", "price": 850, "in_stock": false, "date": "2026-06-18", "photos": ["photos/photo_108@18-06-2026_19-28-02.jpg"], "cat": "other"}, {"id": 122, "title": "\"Слово-Квест\"", "desc": "Твоя перемога на сторінках Біблії!\n\"Слово-Квест\" — динамічна настільна гра, яка перетворює пошук у Біблії на справжній квест. Жодних телефонів чи симфоній, лише ти і твоя паперова Біблія.\nЯк грати?\n• Тягнеш картку із завданням.\n• Усі одночасно починають пошук у Біблії.\n• Хто перший знаходить потрібне місце, той рухається вперед по ігровому полю.\nУ грі є особливі картки, які можуть забрати час, додати бали та змінити лідера на полі.\nДля 3–21 гравця.\nІдеально підходить для:\n• підлітків і молоді,\n• сімейних вечорів,\n• домашніх груп і таборів.", "price": 850, "in_stock": false, "date": "2026-06-18", "photos": ["photos/photo_107@18-06-2026_19-27-52.jpg"], "cat": "other"}, {"id": 121, "title": "\"Квартет\"", "desc": "Гра, в якій для перемоги треба зібрати якнайбільше квартетів\nКвартет — це 4 картки однієї категорії. Наприклад, «Апостоли»: Петро, Іван, Яків, Андрій. Усього в грі 120 карток і 30 різних квартетів.\nЦя біблійна гра розрахована на 4–20 гравців і допоможе не лише цікаво провести час, а й краще пізнати Боже Слово.\nПідійде для:\n• дітей, підлітків, молоді;\n• друзів та родини;\n• домашніх груп.\nДля тих, хто вже грав «Квартет», у правилах є альтернативна версія гри, окрім класичної.\nСпостерігай, запитуй і збирай свої біблійні квартети. Хто збере найбільше — стане переможцем!", "price": 900, "in_stock": false, "date": "2026-06-18", "photos": ["photos/photo_106@18-06-2026_19-27-25.jpg"], "cat": "other"}, {"id": 120, "title": "\"Байбл Метч\"", "desc": "Байбл — це Біблія.\nМетч — це той момент, коли все співпало, як треба.\nА гра «Байбл Метч» — це можливість перевірити, наскільки твої знання «метчаться» з Біблією. Сенс гри в тому, щоб герой «співпав» зі своїм описом.\nГравці по черзі відкривають картки з категорії «Опис» і викладають їх перед усіма. Ті, у кого є картка з іменем, що відповідає опису, кидають її на відкриту картку. Переможе той, хто першим позбудеться всіх своїх карток.\nГра розрахована на 3-10 учасників. Сподобається молоді, родині та домашній групі.", "price": 850, "in_stock": false, "date": "2026-06-18", "photos": ["photos/photo_105@18-06-2026_19-27-10.jpg"], "cat": "other"}, {"id": 119, "title": "\"Справжня розмовна гра для дівчат\"", "desc": "Бути справжньою — найбільша краса.\nМи звикли тримати обличчя та посміхатись, коли болить, і мовчати, коли хочеться говорити.\n«Справжня» — це не просто християнська гра, а привід зібратися з подругами, почути їх і самій бути почутою.\nВсередині — 75 запитань для тих, хто не боїться бути собою. Бо справжність — це краса, а не слабкість", "price": 800, "in_stock": false, "date": "2026-06-18", "photos": ["photos/photo_104@18-06-2026_19-26-51.jpg"], "cat": "other"}, {"id": 118, "title": "«Тільки не кажи “так”»", "desc": "Гра на швидкість та уважність, допомагає збільшити запас слів.\nЄ різні варіанти гри, зазначені в правилах, які в комплекті:\n• класичний без таймера\n• на швидкість\n• зі штрафами\n• з червоними картками (відповідати римою, 3 словами, без певної літери, жестами тощо)\nВесело, цікаво, корисно та підходить для дітей і дорослих.\n*Питання з карток можна використовувати для обговорень в малих групах, для дискусій і т.п.😎", "price": 500, "in_stock": true, "date": "2026-06-18", "photos": ["photos/photo_103@18-06-2026_19-26-36.jpg"], "cat": "other"}, {"id": 117, "title": "Адель Фабер, Елейн Мазліш - Як говорити, щоб діти нас слухали. Як слухати, щоб діти з нами говорили", "desc": "Посібник з дитячої психології та спілкування у сім’ї від Адель Фабер і Елейн Мазліш присвячений складним моментам у комунікації між дорослими й дітьми. Авторки пояснюють, чому звичайні зауваження, повчання чи поспіх часто лише посилюють конфлікти.\nКнига ж пропонує спокійніші способи взаємодії. Тут поєдналися практичний досвід, приклади з реального життя та зрозумілі техніки, які легко застосовувати щодня.", "price": 380, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_102@11-06-2026_16-56-43.jpg"], "cat": "other"}, {"id": 116, "title": "Адель Фабер, Елейн Мазліш - Брати-сестри без суперництва", "desc": "Як діяти батькам, коли їхні діти чубляться і конфліктують? Як досягти бажаної згоди між ними?\nБатьки можуть або загострити боротьбу, або налагодити співпрацю. Їхні вчинки й слова мають велику силу.\nАвтори цієї книжки радять, як опанувати своє роздратування, безпорадність, розпач та озброїтися новими методами й вміннями, що допоможуть жити дітям у злагоді.\nПрактичні поради і життєві приклади, проілюстровані дотепними малюнками, стануть у пригоді усім тим, хто, виховуючи дітей, стикається із проблемою суперництва та конфліктів між ними.", "price": 300, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_101@11-06-2026_16-56-26.jpg"], "cat": "other"}, {"id": 115, "title": "Девід Боеї/Брент Нельсон/Джеф Шульт/Ллойд Шадрах - Підготовка до шлюбу", "desc": "Докладний путівник у розумінні Божого плану любові на все життя.\nВи по-справжньому закохані й прийняли радісне рішення, яке назавжди змінить ваше життя - рішення одружитися. Приємні клопоти, пов′язані з підготовкою до весілля, поглинули вас, і саме час замислитися про підготовку до подружнього життя, яке чекає на вас після святкування. Винагородою за спільне планування стануть тривалі романтичні стосунки.\nСьогодні, як ніколи, життєво важливо присвятити себе довгостроковій меті - побудові християнської сім′ї.\n\"Підготовка до шлюбу\" - це курс, розроблений служінням \"FamilyLife\", який допоможе вам закласти фундамент міцного біблійного союзу.\nЦей курс складається з шести захопливих занять і п′яти романтичних проєктів, які підготують вас до щасливого й тривалого подружнього життя, вкоріненого в нашому Господі Ісусі Христі.", "price": 430, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_100@11-06-2026_16-56-04.jpg"], "cat": "other"}, {"id": 114, "title": "Джон Берк - Уявіть собі небеса", "desc": "Усі ми жадаємо знати, яким буде життя після смерті. І автор бестселерів Джон Берк — не виняток.\nУ цій книзі він розглядає понад сто захопливих свідчень про близькосмертний досвід і порівнює їх із відповідями на найважливіші запитання про Небеса, які дає Біблія: \"Чи буду я там? Чи я залишуся на Небесах собою? Чи зустріну там друзів і близьких? Якими є Небеса? Який на вигляд Ісус Христос? Що ми робитимемо у вічності? Що буде з дітьми?\"\nБерк наочно демонструє, як поширені переживання тисяч тих, хто повернувся до життя — лікарів, професорів, банкірів, людей різного віку і з різних культур, навіть сліпих, — підтверджують приголомшливу картину Небес, яку змальовує Біблія.\nЦя захоплива подорож на Небеса не лише подарує вам відчуття, ніби ви справді там побували, а й назавжди змінить ваш погляд на життя, що на нас чекає, і змусить замислитися, як жити життя теперішнє. Ви побачите, що Небеса навіть дивовижніші, ніж ви колись", "price": 490, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_99@11-06-2026_13-14-00.jpg"], "cat": "other"}, {"id": 113, "title": "Лінда Діллоу - Як воно - бути одруженим зі мною?", "desc": "Книжка «Як воно — бути одруженим зі мною?» містить указівки, як скласти власну заяву про мету шлюбу, допомагає зрозуміти різницю між бажанням мати кращий шлюб і метою мати кращий шлюб — коли ви дивитеся в дзеркало, щоб побачити, як ви можете змінитися.\nЦе книжка про те, як жити в шлюбі день за днем, рік за роком, стаючи такою дружиною, якою ви прагнете бути, і спостерігати, як це впливає на ваш шлюб.", "price": 380, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_98@11-06-2026_13-13-37.jpg"], "cat": "other"}, {"id": 112, "title": "Лінда Діллоу - Творча партнерка", "desc": "Лінда Діллоу витончено і лаконічно мотивує християнок прагнути більшого, ніж вони мають зараз у своєму шлюбі. Вона пропонує творчі поради, як підтримувати чоловіка, жити попри обставини та скласти план, за допомогою якого ви почнете ставати жінкою, дружиною та матір'ю, якою ви прагнете бути.\nВона описує творчу партнерку як щось більше, ніж просто помічницю. Це жінка, яка, обравши (або опинившись у) покликання дружини і матері, вирішує вчитися та розвиватися у всіх сферах цієї ролі.\nКнижка також містить біблійні уроки та посібник із вправами і план щоденного читання Біблії, які будуть чудовою основою для особистого вивчення або для читання в малих групах.", "price": 400, "in_stock": true, "date": "2026-06-11", "photos": ["photos/photo_97@11-06-2026_13-13-08.jpg"], "cat": "other"}, {"id": 111, "title": "Джеррі Бріджес - Дисципліна благодаті. Божа та наша роль у прагненні до святості", "desc": "Забагато благодаті не буває ніколи. Благодать життєво важлива як для зрілого християнина, так і для того, хто ще досі на роздорожжі.\nЯку роль відіграє благодать, коли ми намагаємося жити вірою? Як вона співіснує з прагненням до святості?\nНавчальний посібник \"Дисципліна благодаті\" допоможе збагнути таємниці Божої праці в процесі вашого зростання в Христі, а також зрозуміти вашу частину відповідальності.\nПосібник можна використовувати разом із книжкою або ж окремо. Кожне заняття містить уривок з однойменної книги, а також запитання для особистих роздумів чи обговорення в групі.\nЯкщо ви ще не усвідомлюєте свою роль у вашому християнському зростанні та яку роль відіграє Бог у ньому, то цей посібник розрадить вас і пояснить вам це, щоб ви могли цілковито покластися на Христа та завзято прагнути до святості в житті.", "price": 230, "in_stock": true, "date": "2026-05-01", "photos": ["photos/photo_96@01-05-2026_22-48-11.jpg"], "cat": "other"}, {"id": 109, "title": "Біблія", "desc": "Сучасний переклад.\nМ'яка шкіряна обкладинка, із застібкою-блискавкою.", "price": 2500, "in_stock": true, "date": "2026-05-01", "photos": ["photos/photo_94@01-05-2026_22-46-30.jpg", "photos/photo_95@01-05-2026_22-46-30.jpg"], "cat": "bible"}, {"id": 104, "title": "Біблія", "desc": "Сучасний переклад, поля для нотаток уздовж сторінок", "price": 650, "in_stock": true, "date": "2026-05-01", "photos": ["photos/photo_91@01-05-2026_22-30-07.jpg", "photos/photo_92@01-05-2026_22-30-07.jpg", "photos/photo_93@01-05-2026_22-30-07.jpg"], "cat": "bible"}, {"id": 102, "title": "Біблія", "desc": "Сучасний переклад.\nМ'яка обкладинка.", "price": 950, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_90@29-04-2026_10-11-54.jpg"], "cat": "bible"}, {"id": 101, "title": "Джордж Давидюк - Божий вогонь", "desc": "Усі ми опинялися серед страждань. Ми волаємо до Бога, питаючи «чому», або благаємо Його позбавити нас випробувань. Ми запитуємо: «Чому люди страждають або чому існує трагедія?» тоді, як насправді нам слід запитувати: «Боже, що Ти намагаєшся в мені змінити?»\nУ цій книзі український пастор і місіонер Джордж Давидюк досліджує, як Господь використовує Свій вогонь, щоб випробовувати, навчати та змінювати нас зсередини, надаючи віруючим потужні інструменти для пошуку глибших стосунків із Богом. У житті християн біль та випробування не мають бути безцільними. Вони повинні сприяти виявленню плоду Духа: любові, радості, миру, терпіння, доброти, вірності, самоконтролю. Коли ми усвідомлюємо, що у своїх стражданнях можемо наблизитися до Бога й отримати від Нього здатність стати такими людьми, якими Він хоче нас бачити, то отримуємо ще більший потенціал служити Йому та славити Його.", "price": 500, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_89@29-04-2026_10-11-53.jpg"], "cat": "other"}, {"id": 100, "title": "Джон Пайпер - 50 причин, чому Ісус прийшов померти", "desc": "Чому?\nНайважливішими запитаннями, які може поставити людина, є запитання: Чому Ісус Христос був розіп’ятий? Чому Він стільки страждав? Як це стосується мене? І нарешті, Хто послав Його на смерть?\nВідповідь на останнє запитання – Бог. Ісус був Сином Божим. Ніхто не страждав більше, ніж Він, але все сказане в Біблії веде саме до цієї відповіді.\nЦентральною проблемою смерті Ісуса є не причина, а значення, Боже значення. Саме про це йдеться в цій книзі. Джон Пайпер зібрав 50 причин, основаних на Біблії. Не стільки п’ятдесят причин, скільки п’ятдесят цілей, щоб дати відповідь на найважливіше запитання, з яким має стикнутися кожен з нас: Що зробив Бог для такого грішника, як я, пославши Свого Сина на смерть?", "price": 100, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_88@29-04-2026_10-11-53.jpg"], "cat": "other"}, {"id": 99, "title": "Стів Річардсон,Максін Макдональд - Досконала дитина миру", "desc": "Вируште в подорож на каное в джунглі Нової Гвінеї та відкрийте для себе яскраве селище, сховане високо в кронах дерев.\n«Досконала Дитина Миру» розповідає правдиву історію про те, як Бог використав власну традицію народу саві -дарування немовляти заради примирення - щоб показати їм, що Ісус і є Божою Дитиною Миру. Саме тоді їхні серця почали змінюватися.\nЦя книга запрошує дітей побачити, як Божа любов дарує глибокий і вічний мир у будь-якому куточку світу.\nУ книзі: захоплива та повчальна історія, 5 цікавих уроків із розмальовками, унікальні яскраві ілюстрації, які захоплять і дітей, і дорослих.\nБатьки можуть провести якісний час разом із дітьми: читати цю історію та разом розмальовувати, поєднуючи навчання, творчість і спілкування.", "price": 180, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_87@29-04-2026_10-11-53.jpg"], "cat": "kids"}, {"id": 98, "title": "Кайл Айдлмен - Не фан. Стаючи істинно відданим послідовником Ісуса", "desc": "Словник дає визначення слову \"фан\" як \"палкий прихильник\". Фани хочуть бути близькими з Ісусом, щоб отримувати всі переваги, але не настільки, щоб іти на жертви або зміни у своєму житті. Вони моляться, відвідують церкву і вважають себе християнами. Але чи таких стосунків хоче Ісус із Своїми послідовниками? Ісус ніколи не був зацікавлений в прихильниках. Він ніколи не шукав фанів.\nКнига \"Не фан\" кидає виклик, змушує переосмислити, що для тебе насправді означає - бути християнином. Кайл відверто, розкриваючи некомфортну правду, запрошує тебе чесно подивитися на твої стосунки з Богом. Його заклик іти вслід за Ісусом може здатися радикальним, але це саме те, чого прагне Ісус від кожного віруючого.", "price": 450, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_86@29-04-2026_10-11-53.jpg"], "cat": "other"}, {"id": 97, "title": "Біблія", "desc": "Переклад І. Огієнка.\nМ'яка обкладинка, із застібкою-блискавкою", "price": 1100, "in_stock": false, "date": "2026-04-29", "photos": ["photos/photo_85@29-04-2026_10-11-53.jpg"], "cat": "bible"}, {"id": 96, "title": "Клайв Стейплз Люїс - Чотири любови", "desc": "Книжка Клайва Стейплза Люїса «Чотири любови» була вперше опублікована у 1960 році.\nУ цій книжці Люїс досліджує різні типи любові, які переживає людина, звертаючись як до класичної філософії, так і до християнської теології.\nЛюїс розповідає про жертовну, безкорисливу любов, яку вважає абсолютно чистою і досконалою.\nТакож розглядає форму дружньої любові, яка виникає між людьми, що поділяють спільні інтереси чи погляди.\nТретя форма – це родинна любов. Природна прихильність, наприклад, між батьками і дітьми.\nЧетверта форма любові – романтична. Це любов між закоханими, заснована на пристрасті. Люїс попереджає, що вона може перетворитись на ідола. У правильному контексті — прекрасна і потужна форма любові.\nКнижка Люїса допоможе читачеві віднайти баланс мій усіма формами любові, а саме між природними людськими почуттями і духовним покликанням.", "price": 320, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_84@29-04-2026_10-11-52.jpg"], "cat": "other"}, {"id": 95, "title": "Джеймс Клір - Атомні звички", "desc": "«Атомні звички» це практичний посібник про те, як змінити своє життя через маленькі, але стабільні кроки.\nДжеймс Клір переконливо показує, що не треба кардинально змінювати все навколо, щоб досягти великих результатів. Усе починається з дрібниць «атомних» звичок, які з часом перетворюються на справжні зрушення.\nКнига ґрунтується на науці, але написана простою, живою мовою. У ній багато прикладів з життя, корисних порад і конкретних методів, які можна застосувати вже сьогодні. Це не мотиваційний спіч, а реальний інструмент для змін у роботі, навчанні, спорті чи будь-якій іншій сфері.\nЦе книга, яка надихає не на великі обіцянки, а на маленькі дії, які дійсно працюють.", "price": 500, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_83@29-04-2026_10-11-52.jpg"], "cat": "other"}, {"id": 94, "title": "Кевін Деянг - Шалено зайнятий", "desc": "Чи є у сучасному світі проблема більша, ніж неймовірна зайнятість?\nЧи існує в нашому сьогоденні більша проблема, ніж хронічна перевантаженість?\nІ чи є гостріша й нагальніша проблема, ніж потреба навести лад у шаленій круговерті нашого життя?\nУ своїй черговій книжці-бестселеррі Кевін Деянг дає прості, щирі, біблійно обгрунтовані й неймовірно практичні поради, як саме це зробити і чому це вкрай необхідно.", "price": 180, "in_stock": true, "date": "2026-04-29", "photos": ["photos/photo_82@29-04-2026_10-11-52.jpg"], "cat": "other"}, {"id": 93, "title": "Франсін Ріверс - Рахав. Незасоромлена. Жінка віри", "desc": "Це друга з п’яти новел про жінок у родоводі Ісуса Христа.\nУ книзі «Рахав. Незасоромлена. Жінка віри» авторка Франсін Ріверс розповідає захопливу історію жінки, чия біографія виходить за межі очікувань і кліше.\nРахав — не безгрішна героїня, вона зіткнулася зі страхом, стигмою, сумнівами. Але саме в її житті проявилася Божа сила: Бог не відкинув її, а зробив частиною великого плану порятунку.\nЦей роман — другий у серії «Родовід благодаті», де кожна жінка стане джерелом натхнення, доказом того, що безмежна любов і благодать Бога здатні змінити будь-яке життя. Через драму, надію і Божу вірність книга запрошує читача поглянути на віру не з позиції досконалості, а з усвідомленням: Бог використовує недосконалих людей для великих справ.\nВидання стане чудовим вибором для читачів, які шукають історію про свободу, сміливість, віру і належність до Божої сім’ї.", "price": 320, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_81@21-04-2026_23-33-47.jpg"], "cat": "other"}, {"id": 92, "title": "Клайв Стейплз Люїс - Просто християнство", "desc": "Клайв Стейплз Люїс - всесвітньо відомий богослов і письменник, який частину свого життя був атеїстом і лише згодом навернувся. Він вважається одним із найкращих захисників християнської віри ХХ століття.\nДля невіруючих ця книга — чудова можливість отримати пояснення про все, у що вірують християни. Для християн — велика допомога в розумінні того, у що вони вірять. Цю книжку варто читати кожному, хто хоче знати, що таке справжнє християнство.", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_80@21-04-2026_23-33-47.jpg"], "cat": "other"}, {"id": 91, "title": "Френсіс Чен - Послання християнам", "desc": "У своїй книзі Френсіс Чен закликає читачів стати такою спільнотою люблячих людей, якою їх задумав Бог. У захопливій подорожі сторінками книги автор нагадує: кожен із вас є частиною чогось неосяжно більшого. Чогось священного та величного. Частиною Божої сім’ї.\nЦя книга нагадає про могутню силу християнської віри, величну та святу Божу Церкву. Вона заохотить знову стати спільнотою люблячих та посвячених людей. Думки автора змусять переосмислити, чи дійсно ви живете небесним, а не земним? Френсіс ставить незручні питання і спонукає замислитися: чи побачить Ісус, коли повернеться, поміж нас людей, які піклуються про Тіло Христове й одне одного більше, ніж про власне життя?", "price": 440, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_79@21-04-2026_23-33-46.jpg"], "cat": "other"}, {"id": 90, "title": "Клайв Стейплз Люїс - Переживаючи скорботу", "desc": "Цю книжку К. С. Люїс, знаменитий письменник, учений і мислитель, написав після смерти своєї коханої дружини, з якою йому судилося прожити лише 4 роки. Як апологет християнства, Люїс раніше писав про втрати і страждання, але одна річ – теоретично міркувати, і зовсім інша – переживати самому. Люїс ділиться тим, як він переживає свою скорботу, які питання ставить Богові й до яких висновків доходить.\nЦе глибокі й відверті роздуми (а іноді – й волання) про страждання й біль, радість і любов, смерть і життя після смерти, релігію та Бога.", "price": 220, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_78@21-04-2026_23-33-46.jpg"], "cat": "other"}, {"id": 89, "title": "Тімоті Келлер - Марнотратний Бог", "desc": "У цій книзі Тімоті Келлер використовує притчу про блудного сина для того, щоб пролити світло на головне й найпрекрасніше послання Ісуса: Добру Новину про благодать, надію та спасіння. Келлер викриває, що притчу про блудного сина — найвідомішу з Ісусових усіх притч — досі розуміють дуже поверхово й неправильно. Він знайомить читача з усіма особами цієї позачасової історії і показує, що в ній ідеться не тільки про блудного молодшого сина, а й про старшого і, що вважається… про люблячого Батька.\nУ своїй книзі, яка надихає й спонукає до роздумів, Келлер пропонує всім: як віруючим, так і просто цікавим — нове розуміння ключового послання християнської віри. І це розуміння може повністю змінити все ваше життя.", "price": 450, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_77@21-04-2026_23-33-46.jpg"], "cat": "other"}, {"id": 88, "title": "Боб Гофф - Любов діє", "desc": "Усі пригоди з цієї книжки реальні. Хоча іноді вони видаються настільки неймовірними, що читач періодично вигукуватиме: «Та не може бути!»\nМоже! Бо сам автор, Боб Ґофф, належить до неймовірних людей. Маленьке уточнення – приховано неймовірних.\nЩо це за такі дивні люди? Вас чекає не тільки знайомство з ними, а й доброзичливий штурханець від Боба, що й ви можете бути приховано неймовірними. Як? Ну гаразд, коротенька підказка: якщо спробуєте жити на повну і якщо будете у цьому житті рішучими, сміливими та пристрасними. Головне – пристрасними!\nЦя книжка – про любов, яка ніколи не перестає шукати шляхів, аби повністю виразити себе. Про мрії, які не треба відкладати на потім. І навпаки, про історії, які можна буде потім відкласти у скриньку спогадів, а зараз, просто сьогодні, треба їх активно проживати. Щоб переконатися, що ви – на своєму шляху.", "price": 380, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_76@21-04-2026_23-33-46.jpg"], "cat": "other"}, {"id": 87, "title": "Пізнавай Біблію", "desc": "365 днів у спілкуванні з Господом 240 цікавих оповідань зі Старого Завіту розповідають нам про створення світу, про послух перших людей, про життя патріархів. Вони показують дивовижні шляхи Божі з Ізраїлевим народом. 125 оповідань з Нового Завіту розповідають про прихід licyca Христа на нашу землю, про Його смерть за наші гріхи та про Божий план про\nЦерква Божа.\nДля кращого засвоєння біблійних істин до нашої уваги наприкінці кожної розповіді пропонується кілька запитань.\n365 днів – 365 оповідань – 365 кольорових ілюстрацій – 365х3 питань для роздумів – 7 географічних карт.", "price": 650, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_75@21-04-2026_23-33-46.jpg"], "cat": "kids"}, {"id": 86, "title": "Біблія", "desc": "Сучасний переклад.\nМ'яка обкладинка, із застібкою-блискавкою", "price": 1200, "in_stock": false, "date": "2026-04-21", "photos": ["photos/photo_74@21-04-2026_23-33-46.jpg"], "cat": "bible"}, {"id": 85, "title": "Біблія", "desc": "Сучасний переклад.\nМ'яка обкладинка, із застібкою-блискавкою", "price": 1200, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_73@21-04-2026_23-33-46.jpg"], "cat": "bible"}, {"id": 84, "title": "Біблія", "desc": "Сучасний переклад.\nМ'яка обкладинка, із застібкою-блискавкою", "price": 1200, "in_stock": false, "date": "2026-04-21", "photos": ["photos/photo_72@21-04-2026_23-33-46.jpg"], "cat": "bible"}, {"id": 82, "title": "Біблія", "desc": "Переклад І. Огієнка.\nМ'яка обкладинка, із застібкою-блискавкою", "price": 1200, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_71@21-04-2026_23-33-45.jpg"], "cat": "bible"}, {"id": 81, "title": "Генрі Клауд, Джон Таунсенд - Межі", "desc": "Мати чіткі межі - дуже важливо для здорового, збалансованого стилю життя. Межа - це лінія особистої власності, яка позначає ті речі, за які ми відповідальні. Іншими словами, межі визначають, ким ми є і ким ні.\nЧасто християни настільки фокусуються на тому, щоб бути люблячими і неегоїстичними, що забувають про власні границі та обмеження. Стикаючись із браком меж у собі, вони запитують:\n- Чи можу я встановлювати обмеження і залишатися люблячою людиною?\n- Як мені відповісти тому, хот просить у мене часу, любові, енергії чи грошей?\n- А чи не егоїстично це - мати межі?\n- Чому я почуваюсь винним чи наляканим, коли думаю про встановлення меж?\nКнига пропонує біблійний погляд на межі.\nАвтори прагнуть допомогти нам адекватно застосувати біблійні межі, щоб отримати стосунки і досягти мети, які Бог запланував для нас, як для Своїх дітей.", "price": 490, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_70@21-04-2026_23-33-45.jpg"], "cat": "other"}, {"id": 80, "title": "Богдан Галюк - Бог щоночі запалював світильник", "desc": "У духовному розвитку кожного християнина повинен настати момент, коли його перестають цікавити лише власні здобутки. Він починає перейматися і долею інших. Саме про цю важливу місію християнина - явити комусь образ Бога на землі - розповідає книга.\nТакий спосіб взаємодії Бог запланував у Своїй Церкві, щоб духовно сильніші служили слабшим, більш зрілі - новачкам, батьки - дітям.\nУ духовному батьківстві присутнє і фізичне піклування, і соціальний захист, й інформаційно-культурна безпека, а також духовна опіка. Воно виражається в цілковитому прийнятті, безумовній любові, особистому прикладі, дружбі, повазі, служінні, самопожертві, наставництві.\nУ своїй книзі «Бог щоночі запалював світильник» Богдан Галюк показує алгоритм творення правильного Божественного клімату в житті християнина.", "price": 400, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_69@21-04-2026_23-33-45.jpg"], "cat": "other"}, {"id": 79, "title": "Творчий біблійний щоденник для хлопців", "desc": "Цей чудовий біблійний щоденник містить 40 роздумів над Словом Божим та 40 креативних завдань, які допоможуть тобі провести тиху годину з Богом цікаво та закріпити ці істини у своєму серці завдяки творчому процесу.\nБуде чудовим знаряддям як для особистого вивчення Біблії, так і для занять у недільній школі.", "price": 280, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_68@21-04-2026_23-33-45.jpg"], "cat": "kids"}, {"id": 78, "title": "Пол Девід Тріпп - Виховання. 14 євангельських принципів", "desc": "У цій книжці Пол Тріпп не просто надає список рекомендацій. Натомість він пропонує нам комплексне уявлення про Божий задум для нас, батьків.\nВиокремлюючи чотирнадцять засадничих євангелієцентричних принципів, автор показує, що нам треба дещо більше, ніж сучасні методи чи техніки з виховання.\nТе, чого ми потребуємо, — визвольна Божа благодать, спроможна сформувати правильний погляд на все, до чого ми як батьки маємо стосунок.", "price": 460, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_67@21-04-2026_23-33-45.jpg"], "cat": "other"}, {"id": 77, "title": "Дитяча Біблія", "desc": "Розповіді в ілюстрованій \"Дитячій Біблії\" адаптовані для дітей. У цій книзі в скороченій формі описано значну частину важливих подій з Біблії.\nОкремо подано історії Старого Заповіту та Нового Заповіту. Наприкінці кожної розповіді подано відповідний уривок з Біблії, на основі якого вона написана.\nУсі історії супроводжуються кольоровими зображеннями. На початку книги діти зможуть прочитати інформацію про Біблію. Наприкінці розміщені кольорові карти та фотографії деяких біблійних місць.\nДля дітей молодшого та середнього шкільного віку.", "price": 300, "in_stock": false, "date": "2026-04-21", "photos": ["photos/photo_66@21-04-2026_23-33-45.jpg"], "cat": "kids"}, {"id": 76, "title": "Лі Стробел - Христо під слідством", "desc": "Автор численних журналістських розслідувань у кримінальній хроніці Лі Стробел, шукаючи відповіді на найважливіше запитання життя, досліджує докази археології, медицини й історії та аналізує філософські аргументи, щоб знайти істину про особистість Ісуса Христа. У цьому розслідуванні автор ставить гострі запитання провідним експертам, дослідникам і науковцям світового масштабу, щоб відкрити істину про християнство, Біблію та Ісуса Христа.\nВ книзі «Християнство під слідством» автор спробував розібратися з найбільшими вісьмома «перешкодами» на шляху до віри. Ця книга, яка відзначена нагородою «Золотий медальйон», написана для тих, хто хотів би повірити в Ісуса, але все ще відчуває труднощі й бореться зі складними запитаннями. А також для християн, які хотіли би краще розуміти свою віру та ділитися нею навіть зі своїми найскептичніше налаштованими друзями.", "price": 570, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_65@21-04-2026_23-33-45.jpg"], "cat": "other"}, {"id": 75, "title": "Гері Чепмен - Якби ж ми це знали до одруження", "desc": "Перше, що тобі потрібно знати, дорогий читачу, — ця книжка не про те, як планувати весілля. Ця книжка про те, як створити успішне подружжя. Люди не одружуються з наміром розлучитися. Розлучення — це наслідок відсутності приготування до подружнього життя і невміння спільно працювати над стосунками. Ми часто зустрічаємо успішних людей, які зробили блискучу кар'єру у бізнесі, але у досягненні мети подружнього щастя зазнали краху.\nҐері Чепмен, автор бестселерів про п'ять мов любови, хоче допомогти змінити цю ситуацію своєю книгою. Вона наповнена мудрістю та підказками, які допоможуть багатьом побудувати люблячий, партнерський шлюб, до якого прагнуть чоловіки та жінки. Це та інформація, яку бажав би отримати сам автор до того, як одружився.", "price": 290, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_64@21-04-2026_23-33-45.jpg"], "cat": "other"}, {"id": 74, "title": "Джеймс Добсон - Майже дорослі", "desc": "Допоможіть вашому підлітку підготуватись до дорослого життя.\nГоворити з дітьми на делікатні теми - не легко. Але ж який батько чи мати не хоче, щоб їхня дитина перейшла в підліткові роки з упевненістю і мудрим ставленням до проблем юності і того, що чекає ії поза нею.\nВід вас залежить, чи отримають ваші діти потрібну їм інформацію, щоб зустрітися з майбутніми роками перемін. То з чого ви почнете?\nВже кілька десятиліть поспіль батьки і підлітки покладаються на досвід і поради доктора Джеймса Добсона, викладені в його книзі \"Майже дорослі\".\nДоктор Добсон, провідний сімейний психолог, знає, як відверто і щиро говорити з молодими людьми на теми, які найбільше їх хвилюють. У цьому поліпшеному виданні його класичного бестселера ви знайдете все необхідне для того, щоб зустрітися зі змінами і труднощами процесу дорослішання в новому тисячолітті.", "price": 160, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_63@21-04-2026_23-33-44.jpg"], "cat": "other"}, {"id": 73, "title": "Збірник християнських українських пісень з акордами", "desc": "До книги увійшло 351 пісня українською мовою, які здебільшого відомі у християнському середовищі.\nВсі пісні у змісті розташовані у алфавітному порядку для зручності пошуку по назві.", "price": 750, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_62@21-04-2026_23-33-44.jpg"], "cat": "other"}, {"id": 72, "title": "Кімберлі Мур - Біблія за 52 тижні. Рік вивчення Божого слова для жінок", "desc": "«Біблія за 52 тижні» — це натхненна мандрівка для християнок, у якій увесь маршрут поділено на щоденні читання Божого Слова. Незалежно від того, чи ти проходитимеш цей духовний шлях наодинці, чи в групі з іншими жінками, коментарі до біблійних текстів, які запропоновано для роздумів, запитання та запис власних думок допоможуть тобі глибше й по-новому зрозуміти важливі Господні істини, зміцнити стосунки з Ісусом Христом і плідно провести час із Божим Словом.\nКрім коментарів та пояснень, кожен тиждень читань містить молитву, важливу біблійну цитату або завдання, які слід виконати, щоби поглибити віру чи подолати труднощі, з якими ти борешся.\nГлибоко. Після шести днів читання уривків із Біблії, насолоджуючись недільним днем, ти можеш підсумувати прочитане, пороздумувати над істинами, ділитися ними з іншими… Ти можеш робите все те, що ще більше допоможе тобі любити Бога і людей.", "price": 550, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_61@21-04-2026_23-33-44.jpg"], "cat": "other"}, {"id": 71, "title": "Луі Ґіґліо - Величний наш Бог", "desc": "Луі Ґіґліо переконаний, що творіння виявляє славу Божу. Кожна зі 100 історій для дітей, які наведено у книжці, містить вірш із Писання, саму розповідь, практичне застосування, молитву й захопливий науковий розділ. Усі ці елементи історії мають допомогти дітям укріпити їхню віру в Бога.\nКнижка «Величний наш Бог» захоплює читачів і через вивчення просторів космосу, і через дослідження глибин їхньої душі. Сучасна наука допомагає дітям роздивитися Боже творіння ближче, ніж коли-небудь, і кожен крок на цьому шляху наближатиме їх до Господа, Який дарував життя всьому сущому. 100 дивовижних історій про Бога та науку для сімейного поклоніння — це заклик до поклоніння Богові, запрошення пізнавати Його й стати вірним послідовником Ісуса Христа.", "price": 490, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_60@21-04-2026_23-33-44.jpg"], "cat": "kids"}, {"id": 70, "title": "Джордж Давидюк - У домі мого Батька", "desc": "Дім має бути місцем затишку, любові й чудового сімейного святкування.\nБатьківське благословення дому починається зі щирої турботи й захисту дітей.\nУ книжці \"У домі мого Батька\" йдеться про те, що кожен батько має сильний вплив у своєму домі. І про те, як за досконалим взірцем Бога навчитися батьківства.\nПобудована на основі притчі про блудного сина, книжка акцентує на ролі батька в цій притчі й заохочує татів наслідувати цей приклад.\nДаючи практичні вказівки й тримаючись мудрого та виваженого підходу щодо багатьох питань — батько й пастор Джордж Давидюк радить чоловікам, як зробити свої домівки місцем, до якого їхні діти завжди хотітимуть повертатися, особливо в час потреби.\nЗа допомогою історій зі свого дитинства про взаємини з люблячим батьком і спогадів про побудову стосунків зі своїми дітьми Джордж майстерно передає сміх і сльози, обійми й потрясіння, які супроводжують батьківство.", "price": 480, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_59@21-04-2026_23-33-44.jpg"], "cat": "other"}, {"id": 68, "title": "Рік Воррен - Життя з метою", "desc": "Чому я живу? У чому сенс мого життя? Заради чого я, урешті-решт, живу?\nПерекладена 85-ма мовами світу, книга «Життя з метою» — значно більше, ніж просто книга. Це — путівник, з яким ви пройдете 42 дні незабутньої духовної подорожі. Щойно розпочнете цю мандрівку, як усвідомите, що більше ніколи не будете такими, як колись. Ця книга відкриє вам справжнє життя, для якого ви і з’явилися на світ. Ви знайдете відповіді на три найважливіші питання в житті.\nМета, заради якої ви створені, значно більша, ніж ваші намагання «існувати на цій землі» чи «бути успішним». Ви з’явилися на землі не випадково. Ваше життя — не збіг обставин. Ще задовго до створення Всесвіту Бог уже думав про вас, Він спланував ваше народження задля виконання Своїх задумів. Його любов до вас безмежна, і вона триває значно довше, ніж ті кілька десятиліть, що ви проведете на землі. Адже ви створені, щоби жити вічно! Ви створені, щоби бути з Богом!", "price": 510, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_58@21-04-2026_23-33-43.jpg"], "cat": "other"}, {"id": 67, "title": "Тімоті Келлер - Надія в страшні часи", "desc": "«Надія в страшні часи» — це книжка, яка пояснює читачам значення воскресіння Ісуса Христа.\nГоловне послання християнської віри розкривається так, як це міг зробити тільки Тімоті Келлер — сповнений непохитної віри, глибокого розуміння та нового погляду на історію, яку, як вам здавалося, ви добре знаєте.\nПісля прочитання цієї книжки ви чітко побачите справжнє значення Великодня.\nДля широкого кола читачів.", "price": 500, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_57@21-04-2026_23-33-43.jpg"], "cat": "other"}, {"id": 66, "title": "С. Д. Сміт - Зелений вуглик", "desc": "Рута і Тинько — незвичайні кролики, які живуть звичайним життям, доки їх не наздоганяють катастрофічні події, що вкидають їх у вир пригод. Вони дізнаються, що їхня власна історія пов'язана з подіями, які загрожують захлеснути весь світ.\nКоролі падають і королівства хитаються. Тирани підносяться і загрожують жахіттями. Зрада вабить, а вірність — це розбита дорога з небезпекою за кожним поворотом.\nДе опиняться Рута і Тинько? Як вони вистоять?\nДля дітей і підлітків, а також їхніх батьків.", "price": 510, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_56@21-04-2026_23-33-43.jpg"], "cat": "kids"}, {"id": 65, "title": "Біблійні оповіді для самостійного читання — Двомовне видання", "desc": "Це унікальна книга, яка чудово поєднує вивчення англійської мови та світ біблійних історій. Завдяки двомовному формату (англійська та українська) діти й дорослі, які тільки починають знайомство з англійською мовою, можуть з легкістю розуміти матеріал і паралельно вивчати слова та вирази.", "price": 420, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_55@21-04-2026_23-33-43.jpg"], "cat": "kids"}, {"id": 62, "title": "Гері Чепмен - Якби ж ми це знали, перш ніж наші діти стали підлітками", "desc": "Перехід із дитинства у доросле життя непростий. Вибухи емоцій, перепади настрою, непередбачувана поведінка – непросто і самим підліткам, і їхнім батькам. Але непотрібно впадати у відчай, бо вихід із цієї ситуації є, і знайти його допомагає Ґері Чепмен, автор бестселерів про п'ять мов любови.\n«У цій книжці я поділився дванадцятьма речами, які краще було би знати до того, як ви стали батьками підлітків. Ідеальний час для читання цієї книги, коли вашим дітям виповниться одинадцять або дванадцять років. Що ліпше підготовленими ви будете, то більша ймовірність позитивної реакції з вашого боку на зміни, які відбуватимуться у підлітковому віці ваших дітей. Якщо ж ваші діти вже є підлітками, то, гадаю, ви так само матимете відчутну потребу прочитати цю книжку, і, сподіваюся, вона допоможе вам з навігацією у бурхливих водах підліткового віку».", "price": 290, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_54@21-04-2026_23-33-43.jpg"], "cat": "other"}, {"id": 61, "title": "Гері Чепмен - П'ять мов любови у подружжі", "desc": "У цьому світовому бестселері д-р Гері Чепмен показує, що різні люди виявляють свою любов по-різному. Він говорить про п'ять особливих мов любови й про те, як важливо зрозуміти, якої саме з цих мов потребує ваш партнер у шлюбі.\nМова любові №1: Слова підтримки.\nМова любові №2: Якісний час.\nМова любові №3: Отримування подарунків.\nМова любові №4: Вчинки служіння.\nМова любові №5: Фізичні доторки.", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_53@21-04-2026_23-33-43.jpg"], "cat": "other"}, {"id": 60, "title": "Гері Чепмен, Росс Кемпбелл - П′ять мов любови до дітей", "desc": "Якщо ви зацікавлені, щоб ваша дитина виростала гармонійною особистістю та хочете налагодити з нею діалог взаєморозуміння, навчіться розмовляти мовою, яка властива маленькій людині.\nЦих мов у кожної дитини є п’ять, проте одна з них завжди домінує.\nЯк її визначити, як навчитися вправно нею спілкуватися, як бути вимогливими і водночас люблячими батьками? Опанувати це непросте мистецтво навчають автори пропонованого видання.\nАдресовано батькам, учителям, вихователям та усім, хто опікується дітьми", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_52@21-04-2026_23-33-42.jpg"], "cat": "other"}, {"id": 59, "title": "Джон Буньян - Подорож Пілігріма", "desc": "«Подорож пілігрима» Джона Буньяна — це один із найвидатніших творів англійської літератури. Ця книжка протягом століть заохочувала, кидала виклик та захоплювала дітей і дорослих.\nЦе видання християнської класики містить тридцять оригінальних повносторінкових кольорових ілюстрацій знаного художника Майка Віммера\nОповідь про подорож Християнина до Небесної Країни, під час якої він зустрічається з Євангелістом, Невігласом, Світським Мудрецем та іншими персонажами, допоможе читачам зрозуміти радощі та труднощі життя віри на землі.\nДля широкого кола читачів.", "price": 650, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_51@21-04-2026_23-33-42.jpg"], "cat": "other"}, {"id": 58, "title": "Тімоті Келлер - Свобода від думок про себе", "desc": "У наш час догоджання людям, потурання егоїзму, гонитва за більшим і формування привабливої картинки життя вважають ефективними методами досягнення успіху. Проте Бог закликає нас знайти істинний спокій у дарованій Ним свободі від думок про себе й про своє «я».\nУ цій невеликій книжці автор показує справжню сутність євангельського смирення.\nВона полягає в тому, що ми можемо припинити перейматися тим, що про нас думають люди довкола. Можемо перестати визначати власну цінність на основі порівняння себе з іншими. Припинити віднаходити свою значущість завдяки досягненням та успіху. Можемо перестати засуджувати себе за падіння й возвеличувати за здобутки.\nІстинне євангельське смирення не думає про себе краще чи гірше — воно має свободу думати про себе менше.\nЦя свобода доступна й вам.", "price": 240, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_50@21-04-2026_23-33-42.jpg"], "cat": "other"}, {"id": 57, "title": "Гері Чепмен - Хвилина, присвячена мові любови: Роздуми на кожен день року", "desc": "Книга «Хвилина, присвячена мові любови» — це 365 натхненних, щоденних роздумів, створених для того, щоб змінити Ваші звички та реакції.\nЗнайдіть відповіді на важливі питання:\nЧи правильно я виявляю любов, щоб моя кохана людина це відчула?\nЧи вмію я слухати і щиро просити пробачення?\nЯк укріпити шлюб через прощення, повагу та безумовну любов?", "price": 470, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_49@21-04-2026_23-33-42.jpg"], "cat": "other"}, {"id": 56, "title": "Марті Маховскі - Теологія", "desc": "Теологія — це наука про Бога. Усвідомлюєте ви це чи ні, але наші діти дізнаються про Бога щодня. Ми вчимо їх про Божу могутність і красу, милуючись веселкою чи силою океанських хвиль. Ми вчимо їх про Бога, пояснюючи, що добре, а що погано, коли молимося перед сном і розповідаємо, як важливо простити друга. У цій книзі теологію викладено просто й чітко, вона пояснює глибокі, важливі істини про Бога у зрозумілому для вас і ваших дітей форматі.\n«Теологія» — це багаторівневий навчальний матерiал для школярів. Тодi як ілюстрації зацікавлюють здебiльшого молодших читачів, біблійні посилання забезпечують інший рівень навчання, розширюючи межі використання цiєї книги для старших дітей. Кожен розділ розглядає окрему тему.\nЦя красиво ілюстрована книга занурює дітей в історію, сповнену пригод, таємниць і чудес, у якій вони вiднайдуть істини про Бога, про них самих і про світ довкола нас, істини, які змінюють життя.", "price": 590, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_48@21-04-2026_23-33-42.jpg"], "cat": "kids"}, {"id": 55, "title": "Чемп Торнтон - Радикальна книга для дітей", "desc": "«Радикальна книга для дітей» відправить дітей і підлітків у чудову подорож до витоків християнської віри.\nДіти дізнаються про давню зброю (і про те, як її виготовити), про скарби й дорогоцінне каміння, спробують самі створити гончарні вироби, відкриють для себе стародавні мови, зрозуміють значення християнських символів, навчаться розрізняти зорі, зможуть визначати час за допомогою положення Сонця, пограють у настільну гру, якій 3000 років, і багато іншого.\nЦя дивовижна книжка — веселий, пізнавальний і духовно повчальний ресурс. Поруч із багатьма кумедними й гостроцікавими розповідями про відомих історичних постатей діти та їх батьки дізнаються про корені нашої віри й про необхідність Євангелії для нашого життя.", "price": 640, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_47@21-04-2026_23-33-41.jpg"], "cat": "kids"}, {"id": 54, "title": "Ненсі Гатрі - Що кожна дитина має знати про молитву", "desc": "Ненсі Гатрі у цьому біблійному посібнику доступною мовою пояснює дітям, що таке молитва, як, чому і про що ми можемо молитися. До кожної теми наведено біблійні вірші і приклад молитви для дітей, на основі якої вони можуть самостійно молитися.\nКнижка «Що кожна дитина має знати про молитву» познайомить маленьких читачів із даром молитви та допоможе їм із натхненням і задоволенням звертатися до свого Небесного Отця.\nКнижка буде корисною для дітей дошкільного та молодшого шкільного віку.", "price": 380, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_46@21-04-2026_23-33-38.jpg"], "cat": "kids"}, {"id": 53, "title": "Елізабет Джордж - Слідами біблійних жінок. 365 днів із жінками Біблії", "desc": "Незрівнянний Божий дотик до серця жінки…\nПисання містить безліч розповідей про жінок віри, жінок, які розділять із вами цю глибоку особисту 365-денну мандрівку, сповнену радості та обітниць, й надихатимуть вас.\nЕлізабет Джордж, яка має особливий дар ділитися духовними істинами, розповідає історії жінок Біблії з теплотою й підказує свіжі ідеї, як можна застосовувати біблійний досвід у вашому власному житті.\nЩодня ви знайомитиметеся з історіями, які надихають, що їх розказано з неповторної жіночої точки зору, й це дозволить вам підготувати своє серце та душу до того, аби зустріти прийдешні труднощі та прийняти правильні рішення.\nКорисні підказки, що стосуються практичного застосування біблійних істин у повсякденні, нададуть сил, аби ви могли додати й свою історію до цієї збірки історій про жінок, які любили Бога.", "price": 610, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_45@21-04-2026_23-33-38.jpg"], "cat": "other"}, {"id": 52, "title": "Емерсон Еґґеріч - Любов і повага", "desc": "Ця книга для всіх: хто переживає сімейну кризу чи живе в щасливому шлюбі, хто разом протягом десятиліть чи тільки-но заручився, для пасторів і консультантів, для індивідуального і групового вивчення. Це динамічне й наріжне послання змінює світ, зцілюючи та відновлюючи безліч шлюбів.\nЧого ви прагнете у своєму шлюбі?\nВолієте жити в злагоді?\nХочете насолоджуватися близькістю?\nБажаєте відчувати власну цінність?\nМрієте, щоб ваш шлюб став таким, яким його задумав Бог?\nПослання любові й поваги вчить пари нового підходу до спілкування, розуміння й ставлення одне до одного. Якщо бажаєте миру, близькості й цінності, хочете жити в шлюбі, яким його задумав Бог, ця книжка допоможе вам досягти такої мети.", "price": 500, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_44@21-04-2026_23-33-38.jpg"], "cat": "other"}, {"id": 51, "title": "Тімоті Келлер - Невідомий шлюб", "desc": "Ця книга показує всім, яким має бути щасливий шлюб згідно з Біблією.\nСучасна культура переконує вас, що кожен може знайти свою ідеальну пару;\nщо романтика — найважливіший елемент щасливого шлюбу;\nщо подружній партнер має допомагати вам реалізовувати ваш потенціал;\nщо шлюб — це не назавжди, а до пори, коли ви щасливі;\nщо найкраще розв’язання начебто нездоланних подружніх проблем — це розлучитися й почати все з чистого аркуша. Якщо коротко, то всі ці \"модні\" твердження хибні. Тімоті Келлер разом зі своєю дружиною Кеті, з якою вони разом уже понад сорок років, показує, що шлюб — це величні стосунки. Проте вони лишаються для багатьох із нас загадковими й не до кінця зрозумілими.\n«Невідомий шлюб» — це книжка, що вчить вас будувати успішний шлюб. Її просто повинен прочитати кожен, хто прагне пізнати Бога і навчитися по-справжньому любити інших у своєму житті.", "price": 590, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_43@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 50, "title": "Елліна Леснік - Мій недосконалий шлюб", "desc": "Ми шукаємо досконалості у житті. І часто чекаємо на досконалість від шлюбу. Але що відбувається, коли у шлюбі не все ідеально? Чи потрібно шукати іншого чоловіка чи нескінченно переробляти та журитися, що вибір упав «не на того» і «все це велика помилка»?\n22 шлюби з Писання допоможуть нам з вами побачити, що мета — не в досконалості, а в тому, щоб навчитися приймати, любити і допомагати своєму «недосконалому чоловікові».\nЦя книга — посібник для вивчення, ідеї для побачень, проект для сімейного служіння та допомога у хвилини розпачу.", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_42@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 49, "title": "Елліна Леснік - Мої недосконалі діти", "desc": "Процес виховання дітей не має чіткої інструкції. Немає досконалих батьків. І навіть більше - немає досконалих дітей!\nМи всі бажаємо найкращого для наших дітей і журимося, коли вони засмучують нас своєю поведінкою.\nАле чого ми очікуємо від виховання? Якою є наша мета?\nЦіль виховання полягає в тому, щоб не просто виростити добру й успішну особистість, а показати Бога й навчити Його любити. Хоч ми не маємо гарантії результату, наша відповідальність у тому, щоб допомогти дитині щоденно бачити потребу в Бозі.\nЦя книжка - посібник для дослідження свого серця, ідеї для спільного часу з дітьми, проєкт для служіння батькам і допомога у хвилини, коли опускаються руки.", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_41@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 48, "title": "Прісцилла Ширер - Постанови для жінок", "desc": "Червоною ниткою проходить життя тих жінок, які залишають тривалий вплив на інших. Це не робить їх ідеальними жінками, а просто цілеспрямованими жінками—жінками, які свідомо прокладають шлях свого життя в напрямку Божих обітниць.\nЖиття з таким наміром — ось про що ця книга.\n«Постанови для жінок» повертається в цьому нещодавно переглянутому виданні, оновленому десятирічною свіжою ідеєю та роздумами про те, що означає прокладати стабільний курс у руйнівні, суперечливі часи.\nБудьте частиною іншого покоління, яке надихне закріплювати кожен день і кожну частину свого життя на основі біблійної істини.", "price": 450, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_40@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 47, "title": "Кожен день як дарунок. Книга для сімейного читання", "desc": "Коротенькі оповідання, зібрані у цій невеликій книжечці, своєю свіжістю й чистотою нагадують прозорі краплини вранішньої роси, що виблискує на сонці. Вони не залишать байдужим нікого. Проникливі, щирі та світлі свідчення або прості, але такі глибокі істини, спонукатимуть прагнути добра й світла, шукати любові й тепла кожного, хто їх читатиме.\nКнига буде цікавою та корисною для всіх без винятку читачів, будь-якої вікової категорії. Нею зможуть скористатися вчителі недільних шкіл, наставники у дитячих та підліткових таборах, вона буде доречною і для затишного читання у колі сім′ї або ж для тихих молитовних роздумів на самоті.", "price": 320, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_39@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 46, "title": "Макс Лукадо - Поміч близько. Як знайти нові сили та мету у Святому Дусі", "desc": "Ми всі втомилися від навантажень, які несемо, і викликів, з якими стикаємося. Маємо питання, на які не можемо знайти відповіді, і проблеми, які не можемо розв’язати.\nМи сподівалися, що життя буде захопливою пригодою або подорожжю, яка надихає. Ми ніколи не очікували так швидко втомитися. Але Макс навчає нас, що ми можемо знайти нову силу та мету в силі Святого Духа.\nБіблія містить понад сто згадок про Святого Духа, а Ісус говорить про Духа більше, ніж про церкву, шлюб, фінанси та майбутнє.\nАле чи справді ми знаємо Святого Духа?\nУ книзі «Поміч близько» Макс Лукадо дасть вам інструменти та натхнення, необхідні для того, щоб:\n- дізнатися, хто такий Дух і як Він може допомогти\n- стати радісними, ентузіастичними та наповненими силою, наближаючись до Бога\n- упевнено справлятися з будь-якими труднощами завдяки силі Духа\n- відкрити свої унікальні дари та мету для розширення Божого царства", "price": 390, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_38@21-04-2026_23-33-37.jpg"], "cat": "other"}, {"id": 45, "title": "Рік Уоррен - Цілеспрямоване життя. Духовний путівник для підлітків", "desc": "«Цілеспрямоване життя» – це 365-денна програма для дітей від 9 до 15 років пастора Ріка Воррена, яку він написав за темами та ідеями свого бестселеру «Життя з метою».\nБог кожного створив з певною метою.\nТож тепер час вдумливо і з молитвою розпочати неймовірну подорож до пошуку цієї мети.\nА щоденний вірш зі Святого Письма, коротке повідомлення та провідна думка допоможуть зрозуміти, ким ти є в Божих очах і для чого Господь тебе створив.\nЩоденну молитву можна читати самому або разом із сім’єю.\nМолитва допоможе утвердитися в істині про Божу любов до Своїх дітей і про Його цілі для них.", "price": 400, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_37@21-04-2026_23-33-37.jpg"], "cat": "kids"}, {"id": 43, "title": "Інтерактивна Біблія для дітей", "desc": "Біблія для дітей, яка знайомить зі Словом Божим, залучаючи ігрові елементи.\nУ кінці кожної біблійної розповіді є кроссворд, загадка, або інша розвиваюча вправа, яка у доступній формі допоможе закріпити прочитане.\nЧудові кольорові ілюстрації доповнюють загальну біблійну картину, що охоплює часи від створення нашого світу, аж до його завершення і творення нового буття. Наповнена цікавими завданнями, ця книжка містить більше 100 біблійних історій та вправ для навчання та розваги. Ваша дитина пізнаватиме Божі істини, розвиваючи при цьому своє мислення та уяву.\nРекомендовано для дітей віком від 7 років.", "price": 310, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_36@21-04-2026_23-33-36.jpg"], "cat": "kids"}, {"id": 42, "title": "Григорій Філімончук - Буду згадувати ласки Господні", "desc": "Книга, яка пропонується читачеві, - це спогади, які він власноруч писав уже в похилому віці.\nПисав по-простому, без особливих прикрас, так, як запам′ятав і переніс ці події серцем, не приписуючи собі ніякої слави чи похвали.\n\"Коли Бог вводив Ізраїль у землю обітовану, то не раз говорив йому про те, наскільки важливо пам′ятати шлях, яким Він вів його. І не лише пам′ятати, але і розповідати про нього дітям.\nЯ часто свідчу про любов Божу в зібраннях віруючих або просто під час своїх подорожей автомобілем. Брати, вислухавши мої розповіді, не раз радили мені: \"Ви б написали дещо із своїх переживань. Нехай би прочитали люди, особливо молодь наша\". Так, минають літа, пам′ять моя слабне, дещо вже і забувається. Не завжди пригадую роки, місяці, коли що було, але вирішив щось-таки написати, хоча від того часу, як я прийшов до Бога, минуло 50 років\".\nВід автора", "price": 140, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_35@21-04-2026_23-33-36.jpg"], "cat": "other"}, {"id": 41, "title": "Роджер Глайдвелл - Молодіжне та підліткове служіння за книгою", "desc": "Те, що викладене на сторінках цієї книги,є результатом прагнення розпізнати незмінні, завжди практичні принципи молодіжного служіння, які можна знайти лише в головній книзі - Біблії.\nУ цій книзі йдеться не про програму, а про принципи. Автор щиро сподівається, що читаючи ці розділи, ви заново відкриєте та підтвердите ці принципи.", "price": 340, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_34@21-04-2026_23-33-36.jpg"], "cat": "other"}, {"id": 40, "title": "Пем Кеннеді - 5 хвилин перед сном. Біблійні історії для малят", "desc": "Як навчити малюка молитися, дружити, прощати, бути жалісливим, терпеливим і вдячним? Що йому робити, коли страшно? Чому потрібно говорити правду, навіть якщо це важко? Хто може дати спокій серцю, коли сумно?\nЗручно вмостившись у ліжечку а слухаючи історії з життя маленьких звірят, ваш малюк знайде відповіді на всі ці запитання й неодмінно навчиться запам′ятовувати вірші з Біблії, молитися від серця й розмірковувати про важливе.\nЦе неймовірна книга за красою та змістом. Вона розрахована для дітей від 3-х років. Історії цієї книги стануть найулюбленішими для ваших малюків!", "price": 500, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_33@21-04-2026_23-33-36.jpg"], "cat": "kids"}, {"id": 39, "title": "Ноїв ковчег. Біблійні історії для малят", "desc": "Книжка наповнена кольоровими картинками, де фігурки головних героїв вирізані в віконці книжки.\nДод. інформація: тверда палітурка, закруглені края, картон – жорстка сторінка.", "price": 310, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_32@21-04-2026_23-33-35.jpg"], "cat": "kids"}, {"id": 38, "title": "Несподівані відкриття - Біблійні оповіді", "desc": "Ця дитяча книжка містить 13 найвідоміших історій зі Старого і Нового Завітів, оздоблених 32 потайними віконцями. За цими віконцями на малечу чекають веселі й несподівані відкриття.\nДля більш детального ознайомлення до кожної оповіді подано біблійне посилання. Діти зможуть ознайомитися з тим, як Бог творив світ, як Ной будував ковчег і хто в ньому потім перебував, дізнаються дивовижну історію про те, як Господь послав Свого ангела, щоб той зберіг Даниїла від левів та багато інших чудових біблійних історій.\nУ книзі 20 картонних глянцевих сторінок і тверда глянцева обкладинка, що робить її зручною та безпечною в користуванні для малюків.\nЗміст:\nСтворення світу\nНоїв ковчег\nВихід\nДаниїл у ямі з левами\nЙона і велика риба\nНародження Ісуса\nВесілля в Кані\nЧерез дах до Ісуса\nІсус насичує п′ять тисяч\nПетро ходить по воді\nОстання вечеря Ісуса\nІсус живий!\nДивовижний улов риби", "price": 280, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_31@21-04-2026_23-33-35.jpg"], "cat": "kids"}, {"id": 37, "title": "40 днів. Підлітковий щоденник", "desc": "Це справжній супутник дитини на шляху духовного зростання. Написана з любов’ю і турботою, вона допоможе юним читачам зрозуміти основи християнської віри, навчитися молитись, розмірковувати над Божим Словом і втілювати християнські цінності у своєму повсякденному житті.\nДуховний розвиток\nЩоденні молитви, роздуми і завдання допоможуть дітям краще пізнати Бога і розвинути в собі важливі духовні звички.\nМоральні цінності\nКнижка вчить бути добрим, чесним і співчутливим, наголошуючи на важливості любові до ближнього.\nОсобистісне зростання\nЩоденник допомагає дітям аналізувати свої дії, ставати відповідальнішими і впевненішими у собі, думати про майбутнє.\nІнтерактивність\nКожен день наповнений різноманітними завданнями, запитаннями для роздумів і молитвами, які залучають дитину до активного спілкування з Богом.\nПростота і доступність\nТекст написаний зрозумілою мовою, що робить книгу доступною навіть для найменших читачів.", "price": 620, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_30@21-04-2026_23-33-35.jpg"], "cat": "kids"}, {"id": 36, "title": "Надія Колядич - Кросворди та завдання для дітей", "desc": "Книга містить кросворди та завдання для дітей віком від 7 років і старше. Завдання книги відображають майже весь зміст Старого Заповіту.\nЦя книга може бути використана як на уроках недільної школи, так і для індивідуальних вправ на знання Біблії. Тож Божих благословень тим, хто бажає більше вивчати Слово Боже!\nБіблійні цитати, а також назви та імена приведені за текстом Української Біблії в перекладі І. Огієнка.", "price": 150, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_29@21-04-2026_23-33-35.jpg"], "cat": "kids"}, {"id": 35, "title": "Никодим Марчук - Один з мільйонів", "desc": "Свідоцтво про життя одного з мільйонів християн у важкі години правління радянської влади в нашій країні. Як він з надією на Господа йшов і погляд свій направляв до небес. І тут на землі намагався завжди показати присутність Господнє через своє життя. Щоб виявити світло світу. І як це йому вдавалося...", "price": 350, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_28@21-04-2026_23-33-35.jpg"], "cat": "other"}, {"id": 34, "title": "Глорія Фурман - Дорожити Христом, коли зайняті руки. Євангельські роздуми для заклопотаних матусь", "desc": "За продуктами. Футбольні тренування. Брудний посуд.\nМатеринство — це нелегка праця, і часто здається, що список справ з кожним днем стає все довшим і довшим, що заважає відчувати справжню радість у Бозі, наших дітях і Євангелії.\nУ цій підбадьорливій книзі для виснажених мам Глорія Фурман допомагає нам переорієнтувати наше бачення материнства на те, чого вчить Біблія. Показуючи, як підтримувати живі стосунки з Богом, навіть коли настає зневіра, а білизну все ще потрібно випрати, ця книга допоможе вам глибше цінувати Христа, незалежно від того, наскільки ви зайняті.\nДля широкого кола читачів.", "price": 300, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_27@21-04-2026_23-33-35.jpg"], "cat": "other"}, {"id": 33, "title": "Франсіс Ріверс - Тамара. Без покриття. Жінка надії", "desc": "Це перша з п’яти новел про жінок у родоводі Ісуса Христа.\nЦі жінки жили на Сході у стародавні часи, але і‌хні історі
