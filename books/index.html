ог у Своєму безмежному милосерді використав йх у Своєму досконалому плані, щоб привести Христа, Спасителя світу.", "price": 320, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_24@21-04-2026_23-33-34.jpg"], "cat": "other"}, {"id": 30, "title": "Джен Вілкін - Немає Богу подібних", "desc": "Бог — самобутній, самодостатній, вічний, незмінний, усюдиприсутній, всезнаючий, всемогутній, усевладний, безмежний і незбагненний.\nА ми — ні. І це добре.\nМи створені обмеженими. Ми не можемо і ніколи не зможемо бути Богом. Але в основі кожного гріха лежить наше бунтівне бажання мати ті риси, які притаманні одному лише Богові. У своїй книжці Джен Вілкін закликає нас прийняти свої обмеженості як спосіб прославлення безмежної сили Бога і насолодитися тією свободою, яка виникає, коли ми довіряємо Богові бути Богом.", "price": 440, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_23@21-04-2026_23-33-34.jpg"], "cat": "other"}, {"id": 29, "title": "Джен Вілкін - За Божим образом", "desc": "Ми часто запитуємо: «Яка Божа воля для мого життя?».\nХоча насправді повинні запитувати: «Якою людиною я маю бути?».\nУ Біблії знаходимо чітку відповідь на це запитання: будь подібним до образу Божого.\nДжен Вілкін допомагає читачам побачити, якими мають бути люди, котрі прагнуть відображати у власному житті образ свого Творця.\nУ книзі «За Божим образом» авторка досліджує 10 якостей Божого характеру, які християни покликані наслідувати: бути святими, люблячими, справедливими, добрими, милосердними, благодатними, вірними, терплячими, правдивими та мудрими. Ця книга закликає читачів пізнати мету свого життя і стати тими людьми, якими їх задумав Бог.", "price": 440, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_22@21-04-2026_23-33-34.jpg"], "cat": "other"}, {"id": 28, "title": "Ґері Томас - Священний шлюб", "desc": "Ваш шлюб — це більше ніж священний союз з іншою людиною.\nЦя книжка про те, як ваш шлюб може вам допомогти поглибити свої стосунки з Богом. Від практики щоденного прощення, до величної історії, яку ви, чоловік та дружина, створюєте разом — усе у вашому шлюбі має потенціал для того, щоб ви стали… святими! І не просто святою дружиною чи святим чоловіком, а саме святим подружжям!\nАвтор запрошує зробити невеличку революцію в нашому мисленні про духовність, про святість і про християнське подружжя.\nІ, повірте, він робить це в захопливий спосіб: несподівано для себе ви відкриєте чудові речі про ваш шлюб, незалежно від того, чи він сьогодні міцний, чи залишає бажати кращого. Ви побачите перспективу, яку, можливо, ніхто ніколи вам не показав.\nНаприкінці книги знайдете цікаві, інколи провокаційні запитання для обговорення у подружжі, між нареченими чи у невеликих групах.", "price": 390, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_21@21-04-2026_23-33-34.jpg"], "cat": "other"}, {"id": 27, "title": "Макс Лукадо - Книга Ні про що не тривожтеся. Як віднайти спокій серед хаосу світу", "desc": "«Нічим не журіться, але в усьому молитвою та благаннями з подякою висловлюйте ваші прохання Богові. І мир Божий, який перевищує всяке розуміння, нехай береже ваші серця і ваші думки в Христі Ісусі».\nПослання до Филип’ян 4:6–7 є одним з найвідоміших біблійних уривків, оскільки тривоги — невіддільна частина нашого життя. Однак вони не мають у ньому домінувати.\nЗ Божою силою ви почнете по-новому дивитися в очі своїм страхам.\nНавчитеся сприймати погані новини крізь призму Господнього всевладдя, розпізнавати брехню диявола й нагадувати собі життєво важливу правду. Ви віднайдете життя, сповнене спокоєм, у якому навчитеся протидіяти нападам тривоги.\nНа сторінках цієї книжки ви побачите, як Бог допомагає вам перемогти у війні з постійними хвилюваннями й страхом. Завдяки Його силі зумієте «нічим не журитися» й віднайдете для себе «мир Божий, який перевищує всяке розуміння».", "price": 460, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_20@21-04-2026_23-33-33.jpg"], "cat": "other"}, {"id": 26, "title": "Ліза Теркерст - Небажана. Жити в любові, навіть якщо почуваєшся гіршою за інших, відкиненою та самотньою", "desc": "У цій книжці авторка розповідає про глибоко особистий досвід відкинення – від епізоду уявної зневаги з боку ідеальної жінки у спортзалі до болючих дитячих спогадів про батька, який її покинув.\nЛіза досліджує причини відкинення, а також його здатність отруювати стосунки зі собою і з оточенням, а насамперед – стосунки з Богом.\nЗ біблійною глибиною, неймовірною відвертістю та гумором Ліза допоможе тобі:\n- припинити почуватися покинутою, адже навіть коли ніхто тебе не помічає, Бог завжди поруч;\n- не впадати в розпач, натомість навчитися з Божою допомогою впоратися з болем;\n- знайти слова для молитви, щоб заспокоїти душу і відновити впевненість, коли гостро переживаєш відкинення;\n- подолати два найголовніші страхи, які підживлюють твою невпевненість.\nКнига нагадує нам, що ми створені для любови, яка ніколи не відкидає нас.", "price": 420, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_19@21-04-2026_23-33-33.jpg"], "cat": "other"}, {"id": 25, "title": "Віра Шевченко - Мудрі казки на ніч. Казки для дітей", "desc": "Казка на ніч - це не просто історія перед сном. Це важливий час, проведений з вашою дитиною, який дає їй зрозуміти, як ви її любите і піклуєтеся про неї.\n\"Мудрі казки на ніч\" допоможуть вашим дітям зрозуміти, яких цінностей варто дотримуватися, звідкіля береться життєва мудрість, а також зрозуміти багато інших істин, що допоможуть їм зростати слухняними та благословенними.\nВ кінці кожної казки є цитата з Біблії, що підтверджують висновки, зроблені автором.\nКожна казка закінчується питаннями, які ви зможете задати своїм малюкам.\nЦі казки допоможуть батькам та дітям створити міцні та щирі стосунки любові, взаєморозуміння та довіри.", "price": 600, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_18@21-04-2026_23-33-33.jpg"], "cat": "kids"}, {"id": 24, "title": "Ліза Теркерст - Усе мало би бути по-іншому. Знайти неочікувану силу, коли розчарування тебе руйнує", "desc": "Ліза Теркерст, авторка бестселера «Небажана», приготувала для читачів нову мандрівку в світ її почувань, карколомних ситуацій і роздумів про те, що на все свій час.\nРадість чи смуток, випробування чи щасливе розвʼязання проблем – жодна з життєвих подій не є випадковою.\nЧи саме такий Божий задум?\nАвторка запрошує поміркувати над цим усіх, кому не раз видається, що все мало би бути по-іншому.", "price": 420, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_17@21-04-2026_23-33-33.jpg"], "cat": "other"}, {"id": 23, "title": "Освальд Сандерс - Духовне лідерство", "desc": "З більш ніж мільйоном проданих копій у всьому світі, книга «Духовне лідерство» зарекомендувала себе як справжня класика. У ній висвітлені ключові біблійні принципи стосовно формування й зростання справжнього лідера — як у служінні Богу, так і в будь-якій іншій сфері життя. Християни, що прагнуть вести за собою інших, не можуть пропустити глибокі істини цієї книги.\nУ наш час християнство має звучати на повний голос. Це можливо за умови, що існуватимуть сильні, керовані Богом і посвячені Христу лідери. «Духовне лідерство» надихне вас підкорити свої вміння й таланти Божому керівництву, що дасть вам змогу стати лідером на Його славу.\nТепер у ваших руках нове, виправлене видання, доповнене посібником для вивчення книги в малих групах, який допоможе вам вивчити й ефективно застосувати принципи та істини, викладені у цій класичній книзі.", "price": 460, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_16@21-04-2026_23-33-33.jpg"], "cat": "other"}, {"id": 22, "title": "Тімоті Келлер - Ідоли серця", "desc": "Успіх, кохання, комфорт, контроль…\nМи часто віримо, що саме ці речі принесуть нам щастя. Але чи справді це так?\nОстанній економічний колапс пролив нове світло на ці наші омріяні життєві цілі. Протягом кількох місяців мільйони людей втратили багатство, кар’єру, майно і щасливий шлюб. Не дивно, що так багато з них почуваються загубленими, самотніми, розчарованими та обуреними.\nПравда в тому, що ми перетворили ці хороші речі на богів нашого серця, котрі, однак, нездатні дати нам те, чого ми справді потребуємо. Є тільки один-єдиний Бог, який може сповна й істинно задовольнити наші прагнення, і тепер якнайкращий час, щоб особисто зустрітися з Ним знов — або вперше.\nУ книзі «Ідоли серця» Келлер показує нам, яким чином правильне розуміння Біблії викриває всю правду про ті фальшиві ідеали, що панують у нашому суспільстві та в наших серцях.", "price": 490, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_15@21-04-2026_23-33-33.jpg"], "cat": "other"}, {"id": 21, "title": "Елізабет Джордж - Жінка за серцем Божим", "desc": "Ця книжка про те, як стати жінкою, яка угодна Богові, і слідувати за Ним у всіх сферах свого життя.\nЗ любов’ю і теплотою авторка розповідає, як жити у злагоді з Божими пріоритетами: вірно і віддано служити своєму чоловікові й поважати його; молитися за своїх дітей і навчати їх Слову Божому; піклуватися про свій будинок, створюючи в ньому теплу атмосферу й затишок; духовно зростати, вивчати Писання і перебувати в спілкуванні з Богом.\nКоли жінка слідує за Богом у всіх сферах свого життя, до неї приходить справжній мир і радість.\nВона стає жінкою за серцем Божим.", "price": 450, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_14@21-04-2026_23-33-32.jpg"], "cat": "other"}, {"id": 20, "title": "Коррі Тен Бом - Сховок", "desc": "«Сховок» — це особиста історія Коррі тен Бом про віру в Бога, прощення ворогів і любов до єврейської спільноти, котру нацисти переслідували під час вторгнення та окупації Нідерландів у роки Другої світової війни.\nЯк лідерка підпільного руху опору, Коррі та її сім'я, ризикуючи життям, переховували єврейських друзів за потаємною стіною у Беє, їхньому улюбленому домі над годинниковою крамницею в Гарлемі. Наслідком її героїчних дій став арешт і ув'язнення в найбільшому жіночому концентраційному таборі Німецького Райху — Равенсбруку.\nЗа понад п’ятдесят років існування цієї книги мільйони її читачів змогли побачити, що не існує прірви такої глибокої, де Бог не перебував би поряд і не підтримував би вас у найскрутніші моменти життя.\nТепер «Сховок» видається для українців, щоб засвідчити, як Божа любов не тільки перемагає зло, але й зцілює та відновлює наші серця.", "price": 490, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_13@21-04-2026_23-33-32.jpg"], "cat": "other"}, {"id": 19, "title": "Френсіс Чен - Забутий Бог", "desc": "В Ім’я Отця, і Сина, і …\nМи молимося в ім’я усіх трьох, але часто живемо з думкою лише про перших двох, чи не так?\nПеред вознесінням Ісус пообіцяв послати Святого Духа — Утішителя, щоб зробити нас істинними послідовниками Христа. Та, на жаль, християни сьогодні приймають цей Божий дар, але не починають ним жити.\nЧому ми забуваємо Того, завдяки Кому відрізняємося від усіх інших?\nФренсіс Чен зриває завісу і вказує на справжнє джерело життя християн — Святого Духа. Автор нагадує, що ми були створені та спасенні не для того, щоби просто пройти певний шлях на землі.\nНастав час християнам повернутися до забутого Божого Духа, наповнюватися Його силою, відкрити життя, якого очікує від нас Бог і для якого ми були створені.", "price": 460, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_12@21-04-2026_23-33-32.jpg"], "cat": "other"}, {"id": 18, "title": "Джон Елдредж - Пересуваючи гори. Як молитися пристрасно, впевнено, повновладно", "desc": "Джон Елдредж, відомий християнський письменник, автор численних бестселерів пропонує читачам покроковий посібник із ефективної християнської молитви.\nУ світі, сповненому небезпек, пригод і дивовижних історій, автор пропонує сповнений надії підхід до молитви, яка в змозі вплинути на події, розв’язати проблеми, що найбільше тривожать нас; навчає, як осягнути силу молитви, що може зворушити серце Бога, а також посунути гори.", "price": 400, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_11@21-04-2026_23-33-32.jpg"], "cat": "other"}, {"id": 17, "title": "Франсіс Ріверс - Копальня - не місце для леді", "desc": "У цій масштабній романтичній історії Франсін Ріверс повертає нас на кордон штату Каліфорнія, де на нас чекають перипетії біженки з Нової Англії та колишнього солдата Союзу, якого позбавила спадщини його південна сім’я.\n1875 рік. Коли Кетрін Волш приїжджає до крихітної Кальвади, шахтарського містечка, яке розташовано у Сьєрра-Невада, останнє, про що вона думає — це закохатися.\nЗаможний вітчим вигнав дівчину з Бостона, тож вона приїхала у цю глушину, аби отримати спадщину дядька, якого ніколи не знала: занедбаний офіс газети на головній вулиці, котра рясніла будинками розпусти й салунами, і, здавалося б, маловарту копальню. Зворушена гнобленням місцевих шахтарів та їхніх сімей, Кетрін вирішує відновити випуск газети свого дядька, заступивши дорогу найупливовішим людям Кальвади. Але дівчина має намір продовжувати говорити — і публікувати — усе, що їй заманеться, особливо коли вона впевнена у своїй правоті.", "price": 640, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_10@21-04-2026_23-33-32.jpg"], "cat": "other"}, {"id": 16, "title": "Прісцилла Ширер - Принци воїни. Книга 1", "desc": "«Принци воїни. Книга 1» — захоплива християнська пригодницька повість від авторки Прісцилли Ширер для підлітків і молоді, яка переносить читача у світ невидимої духовної боротьби між добром і злом.\nЧотири звичайні діти раптово опиняються в іншому вимірі, де їм доводиться долати страх, знаходити мужність і відкривати справжню силу не в собі, а в Тому, Хто дає перемогу.\nЧерез яскравий сюжет і символіку духовної броні, взятої зі Слова Божого (Ефесян 6:10–18), книга допомагає юним читачам застосовувати біблійні істини в повсякденному житті, розвивати віру, розрізняти істину від омани та стояти твердо в Божій силі.", "price": 450, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_9@21-04-2026_23-33-32.jpg"], "cat": "kids"}, {"id": 14, "title": "Ейден Вілсон Тозер - Прагнення Бога", "desc": "Що вирізняє надприродно змінене серце?\nНасамперед коли йдеться не про поверхову зовнішню реставрацію, а глибокі внутрішні зміни, що впливають на всі сфери життя.\nУ наш час догоджання людям, потурання егоїзму, гонитва за більшим і формування привабливої картинки життя вважають ефективними методами досягнення успіху.\nПроте Бог закликає нас знайти істинний спокій у дарованій Ним свободі від думок про себе й про своє «я».\nУ цій невеликій проникливій книжці автор показує справжню сутність євангельського смирення.\nВона полягає в тому, що ми можемо припинити перейматися тим, що про нас думають люди довкола.\nМожемо перестати визначати власну цінність на основі порівняння себе з іншими. Припинити віднаходити свою значущість завдяки досягненням та успіху.\nІстинне євангельське смирення не думає про себе краще чи гірше — воно має свободу думати про себе менше.\nЦя свобода доступна й вам.", "price": 440, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_8@21-04-2026_23-33-31.jpg"], "cat": "other"}, {"id": 13, "title": "Клайв Стейплз Люїс - Листи Крутеня", "desc": "Часом ми не віримо, що зло й справді існує у світі.\nНатомість воно настільки витончене, що деколи його просто не помічаємо. Спокуси й пастки нечистого чекають нас будь-де. І не зауважуємо, як в них потрапляємо.\nВідомий в усьому світі християнський письменник Клайв Стейплз Люїс, автор «Хронік Нарнії», прагне показати механізм дії зла у світі.\nФорма, яку обрав автор – листи-повчання старого, досвідченого диявола (Крутеня) до молодого бісика про те, як спокушати людей.", "price": 230, "in_stock": true, "date": "2026-04-21", "photos": ["photos/photo_7@21-04-2026_23-33-31.jpg"], "cat": "other"}, {"id": 12, "title": "Гері Чепмен - Гнів. Як опанувати негативні емоції", "desc": "Без сумніву, більшість людей «мають проблеми» з гнівом. До того ж християни завжди дуже переживають з приводу того, що і в них в const CHANNEL = "v_svitli_books", ORDER = "v_svitli";
const $ = id => document.getElementById(id);
const norm = s => (s || "").toLowerCase().replace(/ё/g, "е");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function card(p) {
  const c = el("article", "card" + (p.in_stock ? "" : " out"));
  if (p.photos.length) {
    const ph = el("div", "photos");
    p.photos.forEach(src => {
      const i = el("img");
      i.src = src; i.loading = "lazy"; i.alt = p.title;
      ph.appendChild(i);
    });
    c.appendChild(ph);
  }
  const info = el("div", "info");
  info.appendChild(el("div", "title", p.title));
  if (p.desc) {
    const d = el("div", "desc", p.desc);
    info.appendChild(d);
    if (p.desc.length > 160) {
      const b = el("button", "more", "Читати далі");
      b.onclick = () => {
        const open = d.classList.toggle("open");
        b.textContent = open ? "Згорнути" : "Читати далі";
      };
      info.appendChild(b);
    }
  }
  const row = el("div", "row");
  row.appendChild(el("div", "price", p.price ? p.price + " ₴" : "—"));
  row.appendChild(el("div", "stock " + (p.in_stock ? "ok" : "no"),
    p.in_stock ? "В наявності" : "Немає в наявності"));
  info.appendChild(row);
  const links = el("div", "links");
  const a1 = el("a", "", "Пост у Telegram");
  a1.href = "https://t.me/" + CHANNEL + "/" + p.id; a1.target = "_blank"; a1.rel = "noopener";
  const a2 = el("a", "", "Замовити");
  a2.href = "https://t.me/" + ORDER; a2.target = "_blank"; a2.rel = "noopener";
  links.append(a1, a2);
  info.appendChild(links);
  c.appendChild(info);
  return c;
}

const CATS = [["bible", "Біблії"], ["kids", "Дитячі книги"], ["other", "Інші книги"]];
let cat = "all";

function match(p) {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  if ($("stock").checked && !p.in_stock) return false;
  const hay = norm(p.title + " " + p.desc);
  return words.every(w => hay.includes(w));
}

function render() {
  const found = POSTS.filter(match);
  const s = $("sort").value;
  const price = p => p.price == null ? Infinity : p.price;
  found.sort((a, b) =>
    s === "new" ? b.id - a.id :
    s === "old" ? a.id - b.id :
    s === "pa" ? price(a) - price(b) :
    s === "pd" ? (b.price || 0) - (a.price || 0) :
    a.title.localeCompare(b.title, "uk"));
  const counts = {all: found.length};
  CATS.forEach(([k]) => counts[k] = found.filter(p => p.cat === k).length);
  document.querySelectorAll(".chip").forEach(b => {
    b.querySelector("span").textContent = counts[b.dataset.cat];
    b.classList.toggle("on", b.dataset.cat === cat);
  });
  const main = $("list");
  main.replaceChildren();
  let shown = 0;
  (cat === "all" ? CATS : CATS.filter(([k]) => k === cat)).forEach(([k, name]) => {
    const items = found.filter(p => p.cat === k);
    if (!items.length) return;
    shown += items.length;
    const sec = el("section");
    if (cat === "all") sec.appendChild(el("h2", "", name));
    const g = el("div", "grid");
    g.append(...items.map(card));
    sec.appendChild(g);
    main.appendChild(sec);
  });
  if (!shown) main.appendChild(el("div", "empty", "Нічого не знайдено"));
  $("count").textContent = "Знайдено: " + found.length + " з " + POSTS.length;
}

[["all", "Усі"], ...CATS].forEach(([k, name]) => {
  const b = el("button", "chip");
  b.dataset.cat = k;
  b.append(name, el("span"));
  b.onclick = () => { cat = k; render(); };
  $("chips").appendChild(b);
});
["input", "change"].forEach(ev => {
  $("q").addEventListener(ev, render);
  $("sort").addEventListener(ev, render);
  $("stock").addEventListener(ev, render);
});
render();

// на телефоні: панель ховається при прокрутці вниз і з'являється при прокрутці вгору
let lastY = 0;
addEventListener("scroll", () => {
  const y = window.scrollY;
  if (document.activeElement !== $("q")) {
    $("tools").classList.toggle("hide", y > lastY && y > 120);
  }
  lastY = y;
}, {passive: true});
</script>
