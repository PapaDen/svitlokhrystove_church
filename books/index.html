<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>В світлі — каталог книг</title>
<meta name="description" content="Каталог християнської літератури з пошуком">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📖</text></svg>">
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2620;--muted:#7a7166;--accent:#a8741a;--accent2:#d9a441;--ok:#2f7d4f;--ok-bg:#e3f3e9;--no:#b23a3a;--no-bg:#f8e4e4;--line:#ece5d8;--shadow:0 2px 10px rgba(80,60,20,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f1b;--text:#f1ebe0;--muted:#a69d8f;--accent:#e2b255;--accent2:#c18a2c;--ok:#7fd49f;--ok-bg:#1e3326;--no:#f19a9a;--no-bg:#3a2121;--line:#332e27;--shadow:0 2px 12px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{text-align:center;padding:44px 20px 28px;background:radial-gradient(900px 300px at 50% -80px,color-mix(in srgb,var(--accent2) 35%,transparent),transparent)}
.hero h1{margin:0;font:700 clamp(28px,5vw,42px)/1.15 Georgia,"Times New Roman",serif;letter-spacing:.2px}
.hero p{margin:8px 0 0;color:var(--muted)}
.tools{transition:transform .25s ease;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:1100px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 25%,transparent)}
input[type=search]{flex:1 1 260px}
label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;font-size:15px}
label input{accent-color:var(--accent);width:18px;height:18px;padding:0}
#count{max-width:1100px;margin:6px auto 0;color:var(--muted);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 48px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}h2{font:700 22px Georgia,"Times New Roman",serif;margin:28px 0 14px;display:flex;align-items:center;gap:12px}h2::after{content:"";flex:1;height:1px;background:var(--line)}.chips{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}.chip span{color:var(--muted);margin-left:4px;font-size:13px}.chip.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-color:transparent}.chip.on span{color:#fff;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:color-mix(in srgb,var(--accent2) 10%,var(--card))}
.photos img{width:100%;flex:0 0 100%;aspect-ratio:4/5;object-fit:contain;scroll-snap-align:center;padding:10px}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.title{font:600 18px/1.3 Georgia,"Times New Roman",serif}
.desc{color:var(--muted);font-size:14.5px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block}
.more{background:none;border:0;color:var(--accent);padding:0;text-align:left;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:20px;color:var(--accent)}
.stock{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.stock.ok{color:var(--ok);background:var(--ok-bg)}.stock.no{color:var(--no);background:var(--no-bg)}
.links{display:flex;gap:10px}
.links a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:10px;border-radius:12px;border:1px solid var(--line);color:var(--text)}
.links a:last-child{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:0}
.out .photos,.out .title{opacity:.55}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
@media (max-width:700px){.tools.hide{transform:translateY(-100%)}}
</style>
</head>
<body>
<div class="hero">
<h1>В світлі</h1>
<p>Християнська література, подарунки та декор</p>
</div>
<div class="tools" id="tools">
<div class="bar">
<input id="q" type="search" placeholder="Пошук: назва, автор, слово з опису…">
<select id="sort">
<option value="new">Спочатку нові</option>
<option value="old">Спочатку старі</option>
<option value="pa">Ціна ↑</option>
<option value="pd">Ціна ↓</option>
<option value="az">За назвою</option>
</select>
<label><input id="stock" type="checkbox"> Лише в наявності</label>
</div>
<div class="chips" id="chips"></div>
<div id="count"></div>
</div>
<main id="list"></main>
<footer>Для замовлення — <a href="https://t.me/v_svitli" style="color:var(--accent)">@v_svitli</a> у Telegram</footer>
<script>
const POSTS = [{"id": 166, "title": "Віктор Гайдучик - Перемога над Голіафом", "desc": "Це не просто чергове теоретичне дослідження, а глибока, щира та максимально відверта сповідь людини, яка пройшла крізь найтемніші куточки людської душі.\nАвтор книги - відомий пастор Віктор Гайдучик - ділиться власною історією затяжної боротьби з депресією, яку він метафорично порівнює з біблійним велетнем Голіафом.\nБудучи духовним наставником для багатьох, автор опинився в полоні емоційного та ментального вигорання, що змусило його переосмислити власне життя, віру та підходи до лікування душевних ран. Книга руйнує стереотипи про те, що депресія — це лише «духовна слабкість» або «недостатня віра». Вона показує цей стан як складну хворобу, яка потребує комплексного підходу: духовного відновлення, підтримки близьких та професійної медичної допомоги.", "price": 180, "in_stock": true, "date": "2026-08-30", "photos": ["photos/photo_151@30-08-2026_18-39-05.jpg", "photos/photo_152@30-08-2026_18-39-05.jpg"], "cat": "other"}, {"id": 165, "title": "Навчальний посібник - Засади віровчення", "desc": "У навчальному посібнику розглянуто основні біблійні засади, на яких будує своє віровчення Українська церква християн віри євангельської (УЦХВЄ). Без знання і розуміння цих істин неможливо бути успішним християнином і повною мірою виконати Божу волю.\nПосібник подає вчення про Триєдність Бога, про Христа, про особу і дари Святого Духа, Боже призначення людини і наслідки гріхопадіння, про Церкву як Тіло Христа; роз’яснює важливість Вечері Господньої, необхідність водного хрещення і хрещення Святим Духом; дає відповіді на питання про матеріальне служіння, необхідність освячення тощо.\nОсобливу увагу приділено питанням молитви, оздоровлення, участі віруючого в духовній війні, загробного життя і прийдешнього людства.\nКоротко подана також історія Української церкви християн віри євангельської.", "price": 450, "in_stock": true, "date": "2026-08-26", "photos": ["photos/photo_150@26-08-2026_15-19-06.jpg"], "cat": "other"}, {"id": 164, "title": "Тоні Ентоні - Приборкання тигра", "desc": "Це правдива розповідь про життя колишнього триразового чемпіону світу з кунг-фу Тоні Ентоні.\nПеребуваючи на вершині своєї майстерності, самовпевнений і владний Тоні швидко йшов вгору по кар’єрних сходинах. Перемоги над суперниками, гроші, впливове оточення – все складалося якнайкраще. Та сталася трагедія, що перетворила учня «шляху просвітлення» на жорстоку, безжальну людину…\nАле він зміг піднятися до Христа із глибин пекла сумнозвісної Центральної в’язниці Нікосії., Його шлях не був легким, але Господь являв Свою милість, підтримував його і сповнив любов’ю затьмарене ненавистю та люттю серце чоловіка, докорінно змінивши його життя.", "price": 170, "in_stock": true, "date": "2026-08-22", "photos": ["photos/photo_149@22-08-2026_19-19-01.jpg"], "cat": "other"}, {"id": 163, "title": "Крег Грошел - Перемога у війні за свої думки", "desc": "Те, що ви думаєте, формує те, ким ви є. Якщо ваші думки вийшли з-під контролю, з-під контролю вийде й усе життя. І Біблія, і сучасна наука надають переконливі докази, що це правда.\nВсі ми намагалися позбутися шкідливих звичок і нездорових моделей мислення, але опинялися в глухому куті через те, що мозок вийшов з-під контролю, а щоденне життя погрузло у рутині.\nКрег Грошел глибоко розуміє нашу щоденну боротьбу з негативним мисленням. У цій книжці він розкриває стратегії, які допоможуть змінити не тільки вашу свідомість, але й усе ваше життя. Спираючись на Біблію та найновіші відкриття науки про мозок, автор висвітлює практичні стратегії, які звільнять вас від тиску шкідливих та деструктивних думок і дозволять жити життям радості й миру — тим життям, яке Бог призначив вам.\nУ Бога є щось краще для вашого життя, ніж ваш старий спосіб мислення. Настав час змінити свої думки, щоби Бог міг змінити ваше життя.", "price": 460, "in_stock": false, "date": "2026-08-22", "photos": ["photos/photo_148@22-08-2026_19-18-05.jpg"], "cat": "other"}, {"id": 162, "title": "Пилип Савочка - Пастир", "desc": "У книзі “Пастир” старший єпископ Пилип Савочка ділиться практичним досвідом, набутим за понад 40 років служіння.\nУ книзі ви знайдете відповіді на запитання, які турбують кожного чесного пастора: що робити, коли немає зростання?\nЧому не виходить зберегти всіх, хто покаявся? Як створити сильну команду, а також навчитися проповідувати і проводити священнодійства? Як побудувати храм? Як уникнути вигорання й перевтоми?", "price": 330, "in_stock": true, "date": "2026-08-22", "photos": ["photos/photo_147@22-08-2026_19-17-24.jpg"], "cat": "other"}, {"id": 161, "title": "Віктор Франкл - Людина в пошуках справжнього сенсу", "desc": "Віктор Франкл описує свій досвід ув’язнення у нацистських концтаборах і те, як його логотерапевтичні теорії допомогли йому й іншим полоненим пережити ті важкі часи. Ця страшна школа життя переконали Віктора, що його метод працює, і він ділиться ним у книзі. Автор зауважує, що ті в’язні, що змогли віднайти сенс і надію на майбутнє, легше переживали умови утримання, були у кращому фізичному й моральному стані й навіть допомагали іншим — «…вони є достатнім доказом того, що в людини можна відібрати все, крім одного, останньої зі свобод — вибирати своє ставлення за будь-яких обставин, вибирати власний шлях». Тож автор висловлює теорію, що відчуття мети прямо впливає на здоров’я людини.", "price": 350, "in_stock": true, "date": "2026-08-22", "photos": ["photos/photo_146@22-08-2026_19-17-02.jpg"], "cat": "other"}, {"id": 160, "title": "Брюс Л. Шеллі - Історія церкви простою мовою", "desc": "Класична однотомна історія церкви Брюса Шеллі являє собою легкий для читання путівник з глобальної історії християнства. Автор проводить своїх читачів від перших століть церкви до сучасної епохи: він розповідає історію про реальних людей, які діють у конкретних ситуаціях і подіях,\nта розкриває обставини й історичний контекст великих періодів або тем християнської історії.\nПерсонажі, місця дії та сюжет перетворюють цю історію церкви на переконливу й захопливу розповідь. До того ж розповідь у міру інтелектуальну: тут ви знайдете огляд найважливіших дискусій та періодів Церкви аж до рухів XXI століття, історію поширення християнства на всіх континентах,\nа також – історії жінок і неєвропейців, які суттєво вплинули на розвиток християнства, але про яких мало говорили в попередніх оглядах церковної історії. Усе це робить «Історію Церкви» Шеллі чудовим гідом церковною історією для будь-якого християнина!", "price": 1200, "in_stock": true, "date": "2026-08-22", "photos": ["photos/photo_145@22-08-2026_19-16-52.jpg"], "cat": "other"}, {"id": 159, "title": "Говард Дж. Гендрікс/Вільям Д. Гендрікс - Жити за книгою. Мистецтво і наука читання Біблії", "desc": "Відкрийте для себе глибину та силу Божого Слова разом із підручником «Жити за Книгою» Дж. Говарда та Д. Вільяма Гендріксів.\nЦей практичний ресурс із біблійної герменевтики допоможе вам не просто читати Біблію, а справді розуміти її та застосовувати у своєму житті.\nАвтори пропонують покрокову методику, яка містить три основні етапи: спостереження, тлумачення та застосування. Ви навчитеся бачити глибші смисли Святого Письма, аналізувати його контекст і дозволяти Божій істині змінювати ваше серце. Незалежно від вашого досвіду у вивченні Біблії, цей підручник стане вашим надійним путівником у пізнанні Божого Слова та побудові живих стосунків із Творцем.", "price": 820, "in_stock": true, "date": "2026-08-22", "photos": ["photos/photo_144@22-08-2026_19-16-40.jpg"], "cat": "other"}, {"id": 158, "title": "Ігор Семенюк - Допоможіть мені це подолати", "desc": "Життя кожного з нас сповнене викликів, які залишають на серці й душі невидимі, але болючі шрами. Ми переживаємо дитячі травми, зради, втрати, смерть близьких, банкрутство, насильство — сексуальне, фізичне, емоційне. Війна, депресія, розчарування… Ці тягарі можуть здаватися непідйомними, а шлях до зцілення — надто складним. Проте навіть у найтемніші моменти є надія, зцілення й перемога. І ця книжка — саме про це!", "price": 600, "in_stock": true, "date": "2026-08-21", "photos": ["photos/photo_143@21-08-2026_14-44-27.jpg"], "cat": "other"}, {"id": 157, "title": "Тетяна Кеба - SOS. Рятуйте наші душі", "desc": "Книга про практичне благовістя. Про те, як посприяти спасінню своїх рідних.\nДе взяти натхнення та силу для благовістя? Що робити, якщо немає досвіду? Куди йти і що саме говорити?\nКнига «SOS! Рятуйте наші душі» допоможе подолати труднощі, з якими стикається кожен євангелист. Ця книга буде чудовим мотиватором для тих, хто бажає, але не наважується благовістити!\nАвтор наводить багато прикладів, дає практичні поради, та надихає кожного християнина не тримати у собі те, що зробив для них Господь.", "price": 400, "in_stock": true, "date": "2026-08-21", "photos": ["photos/photo_142@21-08-2026_14-43-42.jpg"], "cat": "other"}, {"id": 156, "title": "Хельга Мозер - Кінь Дені", "desc": "Серію книг «Ферма в Затишній долині» Хельга Мозер (Helga Moser) написала на основі справжніх подій, що відбулися на фермі її батьків. Ці історії про пригоди тварин допоможуть дітям вивчити важливі життєві уроки.\nЧерез історію про Дені книга допоможе вашій дитині зрозуміти, що лінощі та неробство не приносять задоволення. Як це часто трапляється і в дітей, Дені мав ледачкувату вдачу й нерідко йому бракувало завзятості до роботи. Отримавши довгоочікувані тривалі канікули, кінь-ваговоз раптом усвідомлює, що, позбувшись набридливої щоденної роботи, втратив також і жадані нагороди. Коли ставлення коня до роботи змінюється, його життя набуває нового змісту.", "price": 150, "in_stock": true, "date": "2026-08-15", "photos": ["photos/photo_141@15-08-2026_19-25-18.jpg"], "cat": "kids"}, {"id": 154, "title": "Щоденник-блокнот", "desc": "Християнський щоденник, розроблений у художньому стилі.\nЩоденник складається з шести роздільних частин; у кожному розділі 32 сторінки. Паперовий блок білий в клітинку. На кожній сторінці розміщено надихаючий біблійний текст.", "price": 250, "in_stock": true, "date": "2026-08-15", "photos": ["photos/photo_139@15-08-2026_19-21-48.jpg", "photos/photo_140@15-08-2026_19-21-48.jpg"], "cat": "other"}, {"id": 152, "title": "Декор", "desc": "Декоративна табличка з мотивуючими написами та цитатами з Біблії стане доречним подарунком або ж родзинкою Вашого інтер'єру. Ви можете повісити табличку на стіну або поставити на будь-яку поверхню. Розмір – 15х30 см. Матеріал – МДФ.", "price": 250, "in_stock": true, "date": "2026-08-15", "photos": ["photos/photo_137@15-08-2026_19-17-42.jpg", "photos/photo_138@15-08-2026_19-17-42.jpg"], "cat": "other"}, {"id": 151, "title": "Біблія", "desc": "Сучасний переклад, великий формат з великим шрифтом.\nЗолотий зріз, пошукові індекси, стрічка-закладка, із застібкою-блискавкою.", "price": 1500, "in_stock": false, "date": "2026-08-15", "photos": ["photos/photo_136@15-08-2026_19-16-04.jpg"], "cat": "bible"}, {"id": 150, "title": "Біблія", "desc": "Сучасний переклад, великий формат з великим шрифтом.\nЗолотий зріз, пошукові індекси, стрічка-закладка, із застібкою-блискавкою.", "price": 1500, "in_stock": true, "date": "2026-08-15", "photos": ["photos/photo_135@15-08-2026_19-15-46.jpg"], "cat": "bible"}, {"id": 149, "title": "Біблія", "desc": "Сучасний переклад, великий формат з великим шрифтом.\nЗолотий зріз, пошукові індекси, стрічка-закладка", "price": 1500, "in_stock": true, "date": "2026-08-15", "photos": ["photos/photo_134@15-08-2026_19-15-28.jpg"], "cat": "bible"}, {"id": 148, "title": "Департамент освіти УЦХВЄ - Pro проповідь", "desc": "Цей навчальний посібник присвячений служіння проповіді в церкві. У книзі послідовно розглядаються ключові питання проповідництва: біблійне розуміння проповіді, покликання й формування проповідника, підготовка та дослідження біблійного тексту, побудова структури проповіді, її проголошення й аналіз.\nАвтори поєднують богословські основи, історичний досвід Церкви та практичні інструменти підготовки проповіді, звертаючи увагу на виклики сучасного служіння й реалії церковного життя, зокрема в українському контексті.\nПосібник створений передусім для тих, хто навчається проповідувати, а також буде корисним для досвідчених проповідників і пасторів у їхньому подальшому розвитку та служінні.", "price": 650, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_133@22-06-2026_11-27-32.jpg"], "cat": "other"}, {"id": 147, "title": "Ральф Енлоу - Палітра лідера: сім основних кольорів", "desc": "Ральф Енлоу надає свіжу та креативну концепцію для розуміння біблійного лідерства. У дуже доступному стилі Ральф переплітає глибокі біблійні роздуми з результатами свого дослідження та особистого прикладу біблійного лідерства. Результатом є «кольорова» концептуальна основа, що надає чітке та нове уявлення про біблійне лідерство, а також посібник для застосування цих принципів для того, щоб стати більш ефективним лідером.\nОбов’язково до прочитання для тих, хто серйозно прагне моделювати біблійне лідерство!\nСеред тисяч книг про біблійне лідерство часто залишається незрозумілим, як сьогоднішні християни можуть успішно лідирувати, не піддаючись практикам світу навколо нас. Ця книга яскраво надихає нас бути радикально відмінними та автентичними з огляду на божественне втілене бачення для нас. Вона відзначає унікальність і складність, якими ми всі невід’ємно наділені, щоб реалізувати свій повний потенціал.", "price": 500, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_132@22-06-2026_11-27-21.jpg"], "cat": "other"}, {"id": 146, "title": "Сергій Флюгрант - Як читати Біблію, не спотворюючи її сенсу", "desc": "Ця книга - справжня скарбниця для тих, хто прагне зрозуміти істинний зміст Біблії.\nОсновне послання цієї книги закладено в її назві: \"Як читати книгу, не спотворюючи її сенсу\". Відповідь на це питання дуже проста — читачеві необхідно шукати те значення тексту, яке заклав у нього біблійний автор. Це допоможе не тлумачити Писання, хто як хоче або розуміє, і не надавати значення тексту такого сенсу, якого там ніколи не було. Отже, ця книга спрямована на те, щоб допомогти читачеві виявити в тексті Біблії його первісне значення, зрозуміти його та правильно застосувати у своєму житті.\nОсобливою цю книгу робить її глибоке дослідження в поєднанні з простим і зрозумілим викладом.", "price": 500, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_131@22-06-2026_11-27-00.jpg"], "cat": "other"}, {"id": 145, "title": "Берд Чад - Відкрита милість", "desc": "Відкрита милість. 365 роздумів на щодень, заснованих на несподіваних відкриттях зі старозавітної єврейської мови.\nКнига лютеранського богослова й пастора Чада Берда «Відкрита милість» пропонує читачеві захопливу подорож Старим Завітом, що триватиме цілий рік. Кожного дня автор розкриватиме богословські глибини Святого Письма від книги Буття до книги пророка Малахії, спираючись на значення давньоєврейських слів, що залишаються прихованими для більшості читачів. Втім, ця книга не є мандрівкою лише Старим Завітом. Із особливим хистом та умінням Чад Берд поєднує смисли старозавітніх текстів із Новим Завітом, розкриваючи їх христологічний зміст. Книга написана динамічною, живою мовою, пояснюючи складні філологічні нюанси простими словами.", "price": 650, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_130@22-06-2026_11-26-02.jpg"], "cat": "other"}, {"id": 144, "title": "Томас Кініллі - Список Шиндлера", "desc": "«Список Шиндлера» — це потужний роман про часи Другої світової війни, який не залишає байдужим жодного читача.\nТомас Кініллі майстерно передає атмосферу жахів Голокосту, водночас показуючи силу людського духу та здатність до самопожертви.\nКнига розкриває історію Оскара Шиндлера, бізнесмена, який ризикував власним життям, щоб врятувати сотні євреїв від неминучої загибелі. Читач занурюється у драматичний світ, де страх, відчай та надія переплітаються у щільний і трепетний сюжет.", "price": 550, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_129@22-06-2026_11-25-50.jpg"], "cat": "other"}, {"id": 143, "title": "Святий Августин - Сповідь", "desc": "«Сповідь» — автобіографічний твір, у якому Авґустин у формі молитви розповідає про своє життя, що відрізнялося занепокоєнням, постійним пошуком і багатьма помилками, про свій досвід грішника, котрий відкрив шлях до Бога, саме у Ньому віднайшов усе, чого шукав. Він вважав, що нема святих без минулого, нема грішників без майбутнього. У молодому віці Авґустин втратив віру в Бога, переживав духовну еволюцію і лише згодом повернувся до Церкви і був визнаний взірцем християнського способу життя і служіння.", "price": 380, "in_stock": true, "date": "2026-06-22", "photos": ["photos/photo_128@22-06-2026_11-25-36.jpg"], "cat": "other"}, {"id": 142, "title": "Біблійні лабіринти", "desc": "Ця книжка допоможе дітям познайомитися з героями Біблії, мандруючи за допомогою фломастера лабіринтами відомих біблійних історій.\nБіблійні герої надихатимуть малюків у пошуках правильного шляху в лабіринтах і це стане для них незабутньою пригодою.\nНамальоване легко стерти, тож діти зможуть отримувати насолоду від цієї книжки знову і знову.\nДіти за допомогою лабіринтів зможуть знайти пари для тварин, відпущених Ноєм з ковчегу, порахувати зірки на небі, допоможуть Мойсею дістатися до принцеси, ізраїльтянам подолати Червоне море, знайти шлях до вершини Вавилонської вежі, допомогти Давидові вийти на бій з Голіятом та інше.", "price": 300, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_127@19-06-2026_10-37-41.jpg"], "cat": "kids"}, {"id": 141, "title": "Біблія в числах", "desc": "Ця книжка допоможе дітям у формі гри опанувати лічбу, тренуючи навички володіння ручкою на тлі відомих біблійних історій.\nВона стане гарним помічником у перших спробах письма, пропонуючи готові шаблони. Потрібно лише з′єднати крапки лініями.\nНамальоване легко стерти, тож діти зможуть тренуватися знову і знову.\nЗа допомогою крапок діти зможуть завершити малюнки і числа. За допомогою лічби діти зможуть порахувати китів, зебр, блискавки, левів, факели, павуків, квіти, яблука, морських зірок, рибок та інше. В кінці книги, поєднуючи крапки, діти зможуть навчитися писати числа.", "price": 300, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_126@19-06-2026_10-37-31.jpg"], "cat": "kids"}, {"id": 140, "title": "Біблія завжди зі мною", "desc": "В цій невеличкій книжці зібрано 23 біблійні оповідання, переказані дітям простими словами.\nДіткам сподобається брати її повсюди з собою, та пізнавати дивовижний світ Біблії.", "price": 300, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_125@19-06-2026_10-37-20.jpg"], "cat": "kids"}, {"id": 139, "title": "Захоплююча Біблія для школярів", "desc": "Думаєте, як зробити розповідь про Біблію цікавою та веселою для вашої дитини?\n\"Захоплююча Біблія для школярів\" стане ідеальним рішенням!\nУ цій книжці малюк знайде простий переказ сюжетів зі Святого Письма та безліч завдань, які не дадуть йому занудьгувати.\nСімнадцять історій зі Старого та Нового Завітів, наклейки та головоломки, розмальовки та ілюстрації не залишать байдужою жодну дитину!", "price": 280, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_124@19-06-2026_09-24-50.jpg"], "cat": "kids"}, {"id": 138, "title": "Розкажи мені про Ісуса. Оповідання. Розмальовка", "desc": "Містить 35 коротких, але змістовних оповідей з життя Ісуса разом\nіз реалістичним малюнком для розфарбовування до кожної історії.\nЦі захоплюючі оповідання допоможуть дитині познайомитися з Ісусом та переконатися, що Він дійсно жив на землі і чинив добро всім. І що Він\nможе стати також для неї турботливим, чутливим та надійним Другом.", "price": 100, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_123@19-06-2026_09-24-33.jpg"], "cat": "kids"}, {"id": 137, "title": "Хельга Мозер - Корівка Долі", "desc": "Серію книг «Ферма в Затишній долині» Хельга Мозер (Helga Moser) написала на основі справжніх подій, що сталися на фермі її батьків. Ці історії про пригоди тварин допоможуть дітям вивчити важливі життєві уроки.\nЦя книга розповідає про фермера Дона та корівку Долі, яка багато років вірно водила за собою череду. Коли ветеринар порадив продати сліпу Долі, фермер Дон залишив корівку на фермі, пам’ятаючи її багаторічну віддану працю. Якось Долі впала на льоду і, оскільки не могла побачити безпечну доріжку, боялася вести корів далі. Але фермер Дон терпляче допоміг їй дійти до мети.\nЦя історія допоможе вашій дитині за прикладом фермера Дона навчитися співчутливо ставитися до Божого творіння. Ми хочемо, щоб діти, подорослішавши, усвідомили безмежне Боже терпіння і співчуття до Своїх дітей, які деколи відчувають страх і сумніви. Коли ми розгублені й не знаємо, куди йти, Бог вказує нам шлях Своїм Словом і Духом.", "price": 120, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_122@19-06-2026_09-23-59.jpg"], "cat": "kids"}, {"id": 136, "title": "Хельга Мозер - Кішка Полі", "desc": "Серію книг «Ферма в Затишній долині» Хельга Мозер (Helga Moser) написала на основі справжніх подій, що сталися на фермі її батьків. Ці історії про пригоди тварин допоможуть дітям вивчити важливі життєві уроки.\nІсторія в цій книзі навчає бути старанними. Читаючи, дитина спостерігатиме, як Полі сумлінно шукає надійну схованку після того, як першу було зруйновано. Як і деякі дітки, Полі несмілива та боязка, проте вона наполегливо досліджує всі куточки ферми, щоб знайти місце, де вона зможе сховати свою таємницю. Діти з нетерпінням чекатимуть, коли ж Полі поділиться своєю таємницею з іншими мешканцями ферми.", "price": 120, "in_stock": true, "date": "2026-06-19", "photos": ["photos/photo_121@19-06-2026_09-23-45.jpg"], "cat": "kids"}, {"id": 135, "title": "Петер Мартін, Петер Кент - Слідами Ісуса", "desc": "Ця книжка – ідеальний виклик для шанувальників біблійних історій. На 17 панорамних ілюстраціях зображено безліч людей, тварин, рослин і предметів.\nЩоб їх знайти, знадобиться пильне око й максимальне зосередження.\nОдночасно можна дізнатися багато нового
